# 깃허브 액션(CI/CD) 설정 파일

# 워크플로의 이름 지정
name: CI/CD

# 워크플로가 시작될 조건 지정
on:
  push:
    branches: [ master ] # master 브랜치에 push될 때 워크플로 실행

jobs:
  build:
    runs-on: ubuntu-latest # 깃허브 액션이 실행될 가상의 운영체제(우분투) 환경 지정
    steps: # 실행 스텝 지정

      - name: Checkout repository # 1. 깃허브 저장소의 코드를 가상 우분투 환경으로 가져옴
        uses: actions/checkout@v3

      - name: Set up JDK 17 # 2. 스프링부트를 빌드하기 위해 자바(JDK 17) 환경을 세팅함
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Grant execute permission for gradlew # 3. gradlew(빌드 도구) 파일에 실행 권한을 부여함
        run: chmod +x gradlew

      - name: Build with Gradle # 4. 코드를 컴파일하고 빌드함. 완료되면 build/libs 폴더에 .jar 파일이 생성됨
        run: ./gradlew clean build

      - name: Generate deployment package # 5. .jar 파일과 Nginx 설정이 담긴 .platform 폴더를 모아 deploy-package.zip으로 압축 -> nginx 추가 설정을 위해서
        run: |
          mkdir -p deploy
          cp build/libs/*SNAPSHOT.jar deploy/application.jar
          cp -r .platform deploy/
          cd deploy && zip -r deploy-package.zip .

      - name: Get current time # 6. 배포 버전에 붙일 고유한 시간값을 가져옴 (한국 시간 KST 기준)
        uses: josStorer/get-current-time@v2.0.2
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          utcOffset: "+09:00"

#      - name: Set artifact # 7. 이제 zip 파일 이름이 고정되어 있으므로 동적으로 .jar 이름을 찾을 필요가 없어서 삭제함.
#        run: echo "artifact=$(ls ./build/libs)" >> $GITHUB_ENV

      - name: Beanstalk Deploy # 8. 최종 완성된 zip 파일을 AWS Elastic Beanstalk 환경에 업로드하고 배포함
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ProjectDublin
          environment_name: ProjectDublin-env
          version_label: github-action-${{steps.current-time.outputs.formattedTime}}
          region: ap-northeast-2
          deployment_package: deploy/deploy-package.zip # 👈 [핵심] 기존 .jar 파일 경로를 방금 만든 .zip 파일 경로로 변경