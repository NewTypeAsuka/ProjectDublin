spring:
  datasource:
    url: jdbc:h2:mem:projectdublin-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile

aws:
  s3:
    bucket: projectdublin-test-images
    region: ap-northeast-2
    access-key:
    secret-key:
    key-prefix: articles
    public-base-url:
    legacy-image-prefix-urls: []
    max-file-size: 10MB

stock:
  yahoo-base-url: https://query1.finance.yahoo.com
  watchlist:
    - VOO
    - 8058.T
  cache-duration: 30m
  stale-duration: 24h
  connect-timeout: 3s
  read-timeout: 8s
