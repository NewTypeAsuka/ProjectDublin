# local-h2 프로필에서만 사용하는 인메모리 H2 설정
spring:
  config:
    activate:
      on-profile: local-h2

  datasource:
    url: jdbc:h2:mem:projectdublin-local;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop # 로컬 실행 시 JPA 엔티티를 기준으로 임시 스키마 생성
    defer-datasource-initialization: false

  sql:
    init:
      mode: never # 운영용 SQL 스크립트를 로컬 H2에 자동 실행하지 않음
