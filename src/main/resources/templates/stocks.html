<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title th:text="#{stocks.page.title}">주식 · NewTypeBlog</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- favicon과 Bootstrap CSS -->
    <link rel="stylesheet" href="/css/stocks.css"> <!-- 주식 화면 CSS -->
</head>
<body class="d-flex flex-column min-vh-100 bg-light project-shell tw:bg-canvas tw:text-ink tw:font-sans">
    <!-- 공통 헤더 섹션 -->
    <th:block th:replace="~{common :: siteHeader}"></th:block>

    <!-- 공통 네비게이션 섹션 -->
    <th:block th:replace="~{common :: siteNavbar(true, true)}"></th:block>

    <main id="main-content"
        class="container flex-fill py-4 py-md-5 tw:relative tw:z-0">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9 tw:max-w-4xl">

                <!-- 주식 목록 상단 섹션(주식+티커 검색) -->
                <section class="stock-toolbar" aria-labelledby="stock-page-title">
                    <div class="stock-toolbar__heading">
                        <span class="stock-toolbar__eyebrow">
                            <i class="bi bi-graph-up-arrow" aria-hidden="true"></i>
                            STOCKS
                        </span>
                        <div class="stock-toolbar__title-row">
                            <h2 id="stock-page-title"
                                class="stock-toolbar__title"
                                th:text="#{stocks.heading}">주식</h2>
                            <form id="stock-search-form"
                                class="stock-search"
                                role="search"
                                novalidate>
                                <label class="sr-only"
                                    for="stock-search-input"
                                    th:text="#{stocks.search.label}">주식 티커 검색</label>
                                <input id="stock-search-input"
                                    class="stock-search__input"
                                    type="search"
                                    name="query"
                                    placeholder="티커 검색"
                                    th:placeholder="#{stocks.search.placeholder}"
                                    maxlength="15"
                                    pattern="[A-Za-z0-9.\-]+"
                                    autocomplete="off"
                                    autocapitalize="characters"
                                    spellcheck="false"
                                    enterkeyhint="search"
                                    tabindex="-1"
                                    aria-hidden="true">

                                <button class="stock-search__toggle"
                                    type="submit"
                                    aria-controls="stock-search-input"
                                    aria-expanded="false"
                                    aria-label="검색창 열기"
                                    title="검색창 열기"
                                    th:attr="aria-label=#{stocks.search.open},
                                        title=#{stocks.search.open}">
                                    <i class="bi bi-search" aria-hidden="true"></i>
                                </button>

                                <button id="stock-search-reset"
                                    class="stock-search__reset"
                                    type="button"
                                    aria-label="관심 종목으로 돌아가기"
                                    title="관심 종목으로 돌아가기"
                                    th:attr="aria-label=#{stocks.search.reset},
                                        title=#{stocks.search.reset}"
                                    hidden>
                                    <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </section>

                <!-- 현재 주식 목록과 갱신 기준 안내 섹션 -->
                <section class="stock-summary"
                    aria-label="시세 조회 정보"
                    th:attr="aria-label=#{stocks.summary.aria}">
                    <span class="stock-summary__view">
                        <i class="bi bi-bookmark-star" aria-hidden="true"></i>
                        <span id="stock-view-label"
                            th:text="#{stocks.watchlist}">관심 종목</span>
                        <span id="stock-count" class="stock-summary__count">0</span>
                    </span>
                    <span class="stock-summary__source">
                        <i class="bi bi-clock-history" aria-hidden="true"></i>
                        <span class="stock-summary__source-text">
                            <span class="stock-summary__source-markets"
                                th:text="#{stocks.source.markets}">미국·한국·일본·홍콩·중국 주식 시장 지원</span>
                            <span class="stock-summary__source-cache">
                                <span aria-hidden="true">·</span>
                                <span th:text="#{stocks.source.cache}">30분 캐시</span>
                            </span>
                        </span>
                    </span>
                </section>

                <!-- 마지막 정상 시세와 일부 종목 오류 안내 섹션 -->
                <p id="stock-status"
                    class="stock-status"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                    hidden></p>

                <!-- 주식 카드 로딩 섹션 -->
                <section id="stock-loading"
                    class="stock-state"
                    role="status"
                    aria-live="polite">
                    <span class="stock-state__icon" aria-hidden="true">
                        <span class="spinner-border spinner-border-sm" role="presentation"></span>
                    </span>
                    <strong class="stock-state__title"
                        th:text="#{stocks.loading.title}">주식 시세를 불러오는 중입니다.</strong>
                    <span th:text="#{common.wait}">잠시만 기다려주세요.</span>
                </section>

                <!-- 주식 API 오류 섹션 -->
                <section id="stock-error"
                    class="stock-state"
                    role="alert"
                    hidden>
                    <span class="stock-state__icon" aria-hidden="true">
                        <i class="bi bi-cloud-slash"></i>
                    </span>
                    <strong class="stock-state__title"
                        th:text="#{stocks.error.title}">시세를 불러오지 못했습니다.</strong>
                    <span id="stock-error-message"
                        th:text="#{stocks.error.default}">잠시 후 다시 시도해주세요.</span>
                    <div>
                        <button id="stock-retry-button"
                            class="btn btn-sm stock-state__retry"
                            type="button">
                            <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                            <span th:text="#{common.action.retry}">다시 시도</span>
                        </button>
                    </div>
                </section>

                <!-- 검색 결과가 없을 때 표시할 섹션 -->
                <section id="stock-empty"
                    class="stock-state"
                    role="status"
                    aria-live="polite"
                    hidden>
                    <span class="stock-state__icon" aria-hidden="true">
                        <i class="bi bi-search"></i>
                    </span>
                    <strong class="stock-state__title"
                        th:text="#{stocks.empty.title}">검색된 티커가 없습니다.</strong>
                    <span th:text="#{stocks.empty.description}">티커를 확인한 뒤 다시 검색해주세요.</span>
                </section>

                <!-- 주식 카드 목록 섹션 -->
                <section id="stock-list"
                    class="stock-list"
                    aria-live="polite"
                    aria-busy="true"></section>

                <!-- 주식 시세 이용 안내 영역 -->
                <p class="stock-disclaimer">
                    <span th:text="#{stocks.disclaimer.line1}">표시된 정보는 개인적인 참고용이며</span><br>
                    <span th:text="#{stocks.disclaimer.line2}">실제 거래 시세와 차이가 있을 수 있습니다.</span>
                </p>

            </div>
        </div>
    </main>

    <!-- 공통 푸터 섹션 -->
    <th:block th:replace="~{common :: siteFooter}"></th:block>

    <!-- 주식 JavaScript 렌더링 문구 -->
    <div id="stock-messages"
        hidden
        th:attr="data-search-action=#{stocks.search.action},
            data-search-open=#{stocks.search.open},
            data-watchlist=#{stocks.watchlist},
            data-quote-time-unavailable=#{stocks.quote.time.unavailable},
            data-chart-period=#{stocks.chart.period},
            data-chart-close=#{stocks.chart.close},
            data-chart-empty=#{stocks.chart.empty},
            data-chart-aria=#{stocks.chart.aria},
            data-quote-time-title=#{stocks.quote.time.title},
            data-change-unavailable=#{stocks.change.unavailable},
            data-stock-fallback=#{stocks.stock.fallback},
            data-previous-close=#{stocks.previous.close},
            data-search-result=#{stocks.search.result},
            data-status-stale=#{stocks.status.stale},
            data-status-partial=#{stocks.status.partial},
            data-load-error=#{stocks.load.error},
            data-ticker-invalid=#{stocks.ticker.invalid},
            data-market-us=#{stocks.market.us},
            data-market-jp=#{stocks.market.jp},
            data-market-kr=#{stocks.market.kr},
            data-market-hk=#{stocks.market.hk},
            data-market-cn=#{stocks.market.cn}"></div>

    <script src="/js/siteNavigation.js"></script> <!-- 스크롤 위치에 따른 공통 내비게이션 고정 상태 표시 -->
    <script src="/js/stocks.js"></script> <!-- 관심 종목 조회·티커 검색·일별 주가 그래프 표시 -->
</body>
</html>
