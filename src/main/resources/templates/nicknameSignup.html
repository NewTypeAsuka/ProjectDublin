<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title>닉네임 설정 · NewTypeBlog</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- favicon과 Bootstrap CSS -->
    <style>
        /* animation: 닉네임 설정 화면 배경과 장식 모션 */
        .gradient-custom {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            color: rgba(25, 31, 40, 1);
            background:
                radial-gradient(circle at 12% 12%,
                    rgba(49, 130, 246, 0.16) 0%,
                    rgba(49, 130, 246, 0) 34%),
                radial-gradient(circle at 88% 84%,
                    rgba(92, 124, 250, 0.13) 0%,
                    rgba(92, 124, 250, 0) 32%),
                linear-gradient(145deg,
                    rgba(247, 249, 252, 1),
                    rgba(238, 245, 255, 1));
            background-size: 120% 120%;
            animation: gradientAnimation 24s ease-in-out infinite alternate;
        }
        @keyframes gradientAnimation {
            from { background-position: 0% 0%; }
            to { background-position: 100% 100%; }
        }
        .gradient-custom::before,
        .gradient-custom::after {
            content: '';
            position: fixed;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            pointer-events: none;
        }
        .gradient-custom::before {
            top: -8rem;
            right: -7rem;
            width: 22rem;
            height: 22rem;
        }
        .gradient-custom::after {
            bottom: -6rem;
            left: -5rem;
            width: 16rem;
            height: 16rem;
        }

        /* layout: 닉네임 설정 카드 전체 레이아웃 */
        .signup-shell {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            min-height: 100vh;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .signup-card {
            display: grid;
            grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
            overflow: hidden;
            width: 100%;
            max-width: 62rem;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 2rem;
            background-color: rgba(255, 255, 255, 0.82);
            box-shadow: 0 30px 90px rgba(15, 23, 42, 0.13);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        /* layout: 닉네임 설정 카드 좌측 안내 영역 */
        .signup-story {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 36rem;
            padding: clamp(2rem, 5vw, 3.5rem);
            color: rgba(255, 255, 255, 1);
            background:
                radial-gradient(circle at 82% 12%,
                    rgba(255, 255, 255, 0.22) 0%,
                    rgba(255, 255, 255, 0) 30%),
                linear-gradient(155deg,
                    rgba(49, 130, 246, 1),
                    rgba(27, 100, 218, 1));
        }
        .signup-story::after {
            content: '';
            position: absolute;
            right: -4rem;
            bottom: -5rem;
            width: 17rem;
            height: 17rem;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.08);
        }
        .signup-story__eyebrow {
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.75rem;
            font-weight: 750;
            letter-spacing: 0.16em;
        }
        .signup-story__title {
            max-width: 21rem;
            margin-bottom: 1rem;
            font-size: clamp(2rem, 4.5vw, 3.4rem);
            font-weight: 800;
            line-height: 1.14;
            letter-spacing: -0.06em;
        }
        .signup-story__description {
            max-width: 22rem;
            margin-bottom: 0;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.75;
        }

        /* layout: 닉네임 설정 폼 영역 */
        .signup-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 36rem;
            padding: clamp(2rem, 6vw, 4.5rem);
        }
        .signup-panel__eyebrow {
            margin: 0 0 0.65rem;
            color: rgba(49, 130, 246, 1);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.14em;
        }
        .signup-panel__title {
            margin-bottom: 0;
            color: rgba(25, 31, 40, 1);
            font-size: clamp(1.85rem, 4vw, 2.65rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.055em;
        }
        .signup-message {
            margin: 0.9rem 0 1.8rem;
            color: rgba(107, 118, 132, 1);
            line-height: 1.65;
        }
        .signup-message strong {
            color: rgba(51, 61, 75, 1);
            font-weight: 720;
        }

        /* form: 닉네임 입력창과 글자 수 안내 */
        .nickname-field__label {
            display: block;
            margin-bottom: 0.55rem;
            color: rgba(51, 61, 75, 1);
            font-size: 0.86rem;
            font-weight: 720;
        }
        .nickname-input-wrap {
            position: relative;
        }
        .nickname-input {
            width: 100%;
            min-height: 3.5rem;
            padding: 0.8rem 4rem 0.8rem 1rem;
            border: 1px solid rgba(15, 23, 42, 0.13);
            border-radius: 1rem;
            color: rgba(25, 31, 40, 1);
            background-color: rgba(255, 255, 255, 0.96);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .nickname-input:focus {
            border-color: rgba(49, 130, 246, 0.65);
            box-shadow: 0 0 0 4px rgba(49, 130, 246, 0.12);
        }
        .nickname-input[aria-invalid="true"] {
            border-color: rgba(225, 45, 63, 0.65);
            box-shadow: 0 0 0 4px rgba(225, 45, 63, 0.08);
        }
        .nickname-counter {
            position: absolute;
            top: 50%;
            right: 1rem;
            color: rgba(139, 149, 161, 1);
            font-size: 0.78rem;
            transform: translateY(-50%);
        }
        .nickname-guide {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-height: 1.4rem;
            margin: 0.55rem 0 0;
            color: rgba(107, 118, 132, 1);
            font-size: 0.78rem;
        }
        .nickname-guide.is-valid {
            color: rgba(0, 145, 100, 1);
        }
        .nickname-guide.is-invalid,
        .nickname-error {
            color: rgba(225, 45, 63, 1);
        }
        .nickname-error {
            margin: 0.4rem 0 0;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        /* interaction: 닉네임 가입 완료 버튼 */
        .signup-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            width: 100%;
            min-height: 3.5rem;
            margin-top: 1.35rem;
            border: 0;
            border-radius: 1rem;
            color: rgba(255, 255, 255, 1);
            background: linear-gradient(135deg,
                rgba(49, 130, 246, 1),
                rgba(27, 100, 218, 1));
            box-shadow: 0 13px 30px rgba(49, 130, 246, 0.22);
            font-size: 0.94rem;
            font-weight: 750;
            transition: box-shadow 0.2s ease, transform 0.2s ease,
                opacity 0.2s ease;
        }
        .signup-submit:not(:disabled):hover,
        .signup-submit:not(:disabled):focus {
            box-shadow: 0 17px 36px rgba(49, 130, 246, 0.3);
            transform: translateY(-2px);
        }
        .signup-submit:disabled {
            cursor: not-allowed;
            opacity: 0.48;
            box-shadow: none;
        }
        .signup-submit:focus-visible,
        .account-switch:focus-visible {
            outline: 3px solid rgba(49, 130, 246, 0.3);
            outline-offset: 3px;
        }

        /* layout: Google 계정 전환 안내 */
        .account-switch-form {
            margin-top: 1.2rem;
            text-align: center;
        }
        .account-switch {
            padding: 0.25rem 0.4rem;
            border: 0;
            color: rgba(107, 118, 132, 1);
            background: transparent;
            font-size: 0.78rem;
            text-decoration: underline;
            text-underline-offset: 0.2rem;
        }
        .account-switch:hover {
            color: rgba(27, 100, 218, 1);
        }

        /* 반응형layout: 태블릿·모바일에서 닉네임 설정 카드를 단일 열로 전환 */
        @media (max-width: 767.98px) {
            .signup-card {
                display: block;
                max-width: 32rem;
                border-radius: 1.5rem;
            }
            .signup-story {
                min-height: auto;
                padding: 1.6rem;
            }
            .signup-story__title,
            .signup-story__description {
                display: none;
            }
            .signup-panel {
                min-height: auto;
                padding: 2rem 1.5rem;
            }
        }

        /* 접근성: 사용자가 모션 감소를 선택한 경우 */
        @media (prefers-reduced-motion: reduce) {
            .gradient-custom {
                animation: none;
            }
            .nickname-input,
            .signup-submit {
                transition: none;
            }
        }
    </style>
</head>
<body class="gradient-custom tw:font-sans">
    <main id="main-content" class="container signup-shell tw:relative tw:z-10">

        <!-- 닉네임 설정 카드 섹션 -->
        <section class="signup-card" aria-labelledby="signup-title">

            <!-- 닉네임 설정 카드 좌측 안내 영역 -->
            <div class="signup-story">
                <div>
                    <p class="signup-story__eyebrow">ONE LAST STEP</p>
                    <h2 class="signup-story__title">당신의 이름으로<br>이야기를<br>시작해보세요.</h2>
                    <p class="signup-story__description">
                        선택한 닉네임은 게시글과 댓글에서 나를 나타내는 이름으로 사용됩니다.
                    </p>
                </div>
            </div>

            <!-- 닉네임 설정 카드 우측 입력 영역 -->
            <div class="signup-panel">
                <p class="signup-panel__eyebrow">PROFILE SETUP</p>
                <h1 id="signup-title" class="signup-panel__title">닉네임을 정해주세요.</h1>
                <p class="signup-message">
                    <strong th:text="${googleName}">Google 사용자</strong>님, 반가워요.<br>
                    NewTypeBlog에서 사용할 닉네임을 입력해주세요.
                </p>

                <!-- 최초 로그인 닉네임 입력 폼 -->
                <form id="nickname-signup-form"
                        th:action="@{/signup/nickname}"
                        th:object="${nicknameForm}"
                        method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label for="nickname" class="nickname-field__label">닉네임</label>
                    <div class="nickname-input-wrap">
                        <input id="nickname"
                                class="nickname-input"
                                th:field="*{nickname}"
                                th:attr="aria-invalid=${#fields.hasErrors('nickname')}"
                                type="text"
                                minlength="3"
                                maxlength="12"
                                autocomplete="nickname"
                                aria-describedby="nickname-guide nickname-server-error"
                                placeholder="3~12자로 입력해주세요."
                                required
                                autofocus>
                        <span id="nickname-counter" class="nickname-counter" aria-hidden="true">0/12</span>
                    </div>
                    <p id="nickname-guide" class="nickname-guide" aria-live="polite">
                        <i class="bi bi-info-circle" aria-hidden="true"></i>
                        <span>3자 이상 12자 이하로 입력해주세요.</span>
                    </p>
                    <p id="nickname-server-error"
                        class="nickname-error"
                        th:if="${#fields.hasErrors('nickname')}"
                        th:errors="*{nickname}"
                        role="alert">닉네임 입력을 확인해주세요.</p>

                    <button id="nickname-submit" class="signup-submit" type="submit">
                        <span>가입 완료하기</span>
                        <i class="bi bi-arrow-right" aria-hidden="true"></i>
                    </button>
                </form>

                <!-- 다른 Google 계정으로 다시 로그인 -->
                <form class="account-switch-form" th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="account-switch" type="submit">다른 Google 계정으로 로그인</button>
                </form>
            </div>

        </section>
    </main>

    <script src="/js/nicknameSignup.js"></script> <!-- 닉네임 글자 수와 가입 버튼 상태 관리 -->
</body>
</html>
