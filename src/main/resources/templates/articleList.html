<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title>✨NewTypeBlog✨</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- 사이트 공통 favicon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"> <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> <!-- Bootstrap Icons CSS -->
    <th:block th:replace="~{common :: styles}"></th:block>
    <style>
        .article-list-toolbar { /* 글 목록 상단 툴바 영역 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: nowrap;
        }
        .article-list-toolbar__heading {
            min-width: 0;
            margin-bottom: 0;
        }
        .article-card-link { /* 글 목록 카드 링크 스타일 */
            display: block;
            margin-bottom: 1rem;
            color: inherit;
            text-decoration: none;
        }
        .article-card-link:hover,
        .article-card-link:focus {
            color: inherit;
            text-decoration: none;
        }
        .article-card {
            position: relative;
            overflow: hidden;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .pinned-corner {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            width: 0;
            height: 0;
            border-top: 2.25rem solid #ffc107;
            border-right: 2.25rem solid transparent;
        }
        .article-card.is-pinned .article-card__number {
            padding-left: 1.1rem;
        }
        .article-card__header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }
        .article-card__meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.35rem;
            flex-shrink: 0;
            text-align: right;
        }
        .article-card__separator {
            color: #adb5bd;
        }
        .article-card__metric {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .article-card__like-icon {
            color: #e03131;
        }
        .article-card-link:hover .article-card,
        .article-card-link:focus .article-card,
        .article-card-link:focus-visible .article-card {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12) !important;
        }
        .article-card-link:focus-visible {
            outline: none;
        }
        @media (max-width: 575.98px) {
            .article-card__header {
                flex-direction: column;
                gap: 0.25rem;
            }
            .article-card__meta {
                justify-content: flex-start;
                padding-left: 1.1rem;
                text-align: left;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <th:block th:replace="~{common :: siteHeader}"></th:block>

    <th:block th:replace="~{common :: siteNavbar(true)}"></th:block>

    <main class="container flex-fill py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9">
                <div class="article-list-toolbar mb-4">
                    <div class="article-list-toolbar__heading">
                        <h2 class="h4 mb-1">포스트</h2>
                    </div>
                </div>

                <a th:each="item : ${articles}" th:href="@{/articles/{id}(id=${item.id})}" class="article-card-link"> <!-- article 개수만큼 반복 -->
                    <article class="card border-0 shadow-sm article-card"
                             th:classappend="${item.pinned} ? ' is-pinned'">
                        <span th:if="${item.pinned}" class="pinned-corner">
                            <span class="sr-only">고정 게시글</span>
                        </span>
                        <div class="card-body p-4">
                            <div class="article-card__header text-muted small mb-2">
                                <div class="article-card__number" th:text="${item.id}"></div>
                                <div class="article-card__meta">
                                    <span th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                    <span th:text="|by ${item.author}|"></span>
                                    <span class="article-card__separator" aria-hidden="true">·</span>
                                    <span class="article-card__metric" title="조회수">
                                        <i class="bi bi-eye" aria-hidden="true"></i>
                                        <span class="sr-only">조회수</span>
                                        <span class="article-card__view-count"
                                              th:text="${item.viewCount}"></span>
                                    </span>
                                    <span class="article-card__separator" aria-hidden="true">·</span>
                                    <span class="article-card__metric" title="좋아요">
                                        <i class="bi bi-heart-fill article-card__like-icon"
                                           aria-hidden="true"></i>
                                        <span class="sr-only">좋아요</span>
                                        <span class="article-card__like-count"
                                              th:text="${item.likeCount}"></span>
                                    </span>
                                    <span class="article-card__separator" aria-hidden="true">·</span>
                                    <span class="article-card__metric" title="댓글">
                                        <i class="bi bi-chat-dots" aria-hidden="true"></i>
                                        <span class="sr-only">댓글</span>
                                        <span class="article-card__comment-count"
                                              th:text="${item.commentCount}"></span>
                                    </span>
                                    <th:block th:if="${item.updatedAt != null
                                            and item.createdAt != null
                                            and item.updatedAt.isAfter(item.createdAt)}">
                                        <span class="article-card__separator"
                                              aria-hidden="true">·</span>
                                        <span class="article-card__modified">수정됨</span>
                                    </th:block>
                                </div>
                            </div>
                            <div>
                                <h3 class="h5 mb-2 text-break" th:text="${item.title}"></h3>
                                <p class="mb-0 text-secondary text-break" th:text="${item.content}"></p>
                            </div>
                        </div>
                    </article>
                </a>
            </div>
        </div>
    </main>

    <th:block th:replace="~{common :: siteFooter}"></th:block>

    <!-- 스크롤에 따른 내비게이션 상태 변경 -->
    <script>
        const siteHeader = document.querySelector('.site-header');
        const siteNav = document.getElementById('site-nav');

        if (siteHeader && siteNav) {
            const syncStickyNavState = function () {
                siteNav.classList.toggle('is-stuck', siteHeader.getBoundingClientRect().bottom <= 0);
            };

            syncStickyNavState();
            window.addEventListener('scroll', syncStickyNavState, { passive: true });
            window.addEventListener('resize', syncStickyNavState);
        }
    </script>
    <script src="/js/article.js"></script>
</body>
</html>
