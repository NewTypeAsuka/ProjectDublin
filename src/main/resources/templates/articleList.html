<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title>포스트 · NewTypeBlog</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- favicon과 Bootstrap CSS -->
    <th:block th:replace="~{common :: styles}"></th:block>
    <style>
        /* layout: 게시글 목록 도입부와 상단 제목 */
        .article-list-toolbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }
        .article-list-toolbar__heading {
            width: 100%;
            min-width: 0;
            margin-bottom: 0;
        }
        .article-list-toolbar__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.75rem;
            color: rgba(27, 100, 218, 1);
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .article-list-toolbar__title {
            margin: 0;
            color: rgba(25, 31, 40, 1);
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 780;
            letter-spacing: -0.055em;
            line-height: 1.08;
        }
        .article-list-toolbar__title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            min-width: 0;
            padding-bottom: 0.7rem;
        }

        /* layout: 게시글 검색 입력창과 아이콘 버튼 */
        .article-list-search {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.45rem;
            flex: 0 1 auto;
            min-width: 2.75rem;
        }
        .article-list-search__input {
            box-sizing: border-box;
            width: 0;
            min-width: 0;
            height: 2.75rem;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 999px;
            opacity: 0;
            color: rgba(51, 61, 75, 1);
            background-color: rgba(255, 255, 255, 0.96);
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
            pointer-events: none;
            transition: width 0.22s ease, padding 0.22s ease,
                border-color 0.18s ease, opacity 0.16s ease;
        }
        .article-list-search.is-open .article-list-search__input {
            width: clamp(10rem, 24vw, 17rem);
            padding: 0.55rem 1rem;
            border-color: rgba(49, 130, 246, 0.2);
            opacity: 1;
            pointer-events: auto;
        }
        .article-list-search__input::placeholder {
            color: rgba(139, 149, 161, 1);
        }
        .article-list-search__toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 2.75rem;
            width: 2.75rem;
            height: 2.75rem;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 999px;
            color: rgba(49, 130, 246, 1);
            background-color: transparent;
            font-size: 1.05rem;
            transition: border-color 0.18s ease, color 0.18s ease,
                background-color 0.18s ease, transform 0.18s ease;
        }
        /* interaction: 게시글 검색 컨트롤의 hover·focus·열림 상태 */
        .article-list-search__toggle:hover,
        .article-list-search__toggle:focus,
        .article-list-search.is-open .article-list-search__toggle {
            border-color: rgba(49, 130, 246, 0.14);
            color: rgba(27, 100, 218, 1);
            background-color: rgba(235, 244, 255, 1);
        }
        .article-list-search__toggle:active {
            transform: scale(0.96);
        }
        /* 접근성: 게시글 검색 컨트롤의 키보드 포커스 표시 */
        .article-list-search__input:focus-visible,
        .article-list-search__toggle:focus-visible {
            outline: 3px solid rgba(49, 130, 246, 0.25);
            outline-offset: 3px;
        }
        /* layout: 미사용 보존 - 우측 장식 마크업이 현재 HTML에서 주석 처리되어 있다.
        .article-list-toolbar__symbol {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            border: 1px solid rgba(49, 130, 246, 0.12);
            border-radius: 1.35rem;
            color: rgba(49, 130, 246, 1);
            background-color: rgba(235, 244, 255, 1);
            box-shadow: 0 14px 34px rgba(49, 130, 246, 0.12);
            font-size: 1.45rem;
        }
        */

        /* layout: 게시글 카드 외곽 링크 */
        .article-card-link {
            display: block;
            margin-bottom: 1.15rem;
            color: inherit;
            text-decoration: none;
        }
        /* interaction: 게시글 카드 링크의 hover·focus 상태 */
        .article-card-link:hover,
        .article-card-link:focus {
            color: inherit;
            text-decoration: none;
        }
        /* layout: 게시글 카드 표면과 내부 여백 */
        .article-card {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(15, 23, 42, 0.07) !important;
            border-radius: 1.6rem;
            background-color: rgba(255, 255, 255, 0.94);
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.055) !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease,
                border-color 0.2s ease;
        }
        /* interaction: 게시글 카드의 hover·focus 부상 효과 */
        .article-card-link:hover .article-card,
        .article-card-link:focus .article-card,
        .article-card-link:focus-visible .article-card {
            border-color: rgba(49, 130, 246, 0.22) !important;
            transform: translateY(-3px);
            box-shadow: 0 24px 56px rgba(15, 23, 42, 0.1) !important;
        }
        /* 접근성: 게시글 카드 링크의 키보드 포커스 표시 */
        .article-card-link:focus-visible {
            border-radius: 1.6rem;
            outline: 3px solid rgba(49, 130, 246, 0.28);
            outline-offset: 4px;
        }
        .article-card__body {
            padding: clamp(1.35rem, 4vw, 2rem) !important;
        }

        /* layout: 게시글 식별자와 고정 표시 */
        .article-card__number {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            flex-shrink: 0;
            min-height: 1.85rem;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            color: rgba(107, 118, 132, 1);
            background-color: rgba(242, 244, 246, 1);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .article-card__pin {
            color: rgba(49, 130, 246, 1);
            font-size: 0.85rem;
            line-height: 1;
        }
        /* layout: 게시글 작성 일시와 작성자 정보 */
        .article-card__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.9rem;
        }
        .article-card__byline {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.35rem;
            min-width: 0;
            text-align: right;
            line-height: 1.55;
        }
        .article-card__byline-main {
            white-space: nowrap;
        }
        .article-card__separator {
            color: rgba(190, 198, 207, 1);
        }
        .author-admin-badge {
            margin-left: 0.2rem;
            color: rgba(29, 155, 240, 1);
            line-height: 1;
        }

        /* layout: 게시글 조회수·좋아요·댓글 지표 */
        .article-card__metrics {
            display: flex;
            align-items: center;
            /* layout: 미사용 보존 - 모든 카드의 Bootstrap justify-content-end가 대체한다.
            justify-content: flex-end;
            */
            flex-wrap: nowrap;
            gap: 0.1rem;
            width: fit-content;
            max-width: 100%;
            margin-left: auto;
            padding: 0.15rem 0.25rem;
            border-radius: 999px;
            background-color: rgba(247, 249, 252, 1);
            text-align: right;
            white-space: nowrap;
        }
        .article-card__metric {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            min-height: 1.9rem;
            padding: 0.25rem 0.45rem;
            background-color: transparent;
        }
        .article-card__like-icon {
            color: rgba(224, 49, 49, 1);
        }

        /* layout: 게시글 제목과 미리보기 말줄임 */
        .article-card__title {
            display: -webkit-box;
            max-height: 2.8em;
            margin-bottom: 0.7rem !important;
            overflow: hidden;
            color: rgba(25, 31, 40, 1);
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 740;
            line-height: 1.4;
            letter-spacing: -0.035em;
            overflow-wrap: anywhere;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }
        .article-card__preview {
            display: -webkit-box;
            overflow: hidden;
            color: rgba(91, 103, 117, 1) !important;
            line-height: 1.75;
            overflow-wrap: anywhere;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
        }

        /* layout: 게시글 피드의 추가 로딩과 빈 목록 상태 */
        .article-feed__controls {
            min-height: 4.5rem;
            color: rgba(107, 118, 132, 1);
        }
        .article-feed__sentinel {
            width: 100%;
            height: 1px;
        }
        .article-feed__load-button {
            min-height: 2.75rem;
            padding: 0.55rem 1rem;
            border-color: rgba(15, 23, 42, 0.1);
            /* layout: 미사용 보존 - 마크업의 app-button이 important radius를 적용한다.
            border-radius: 999px;
            */
            color: rgba(51, 61, 75, 1);
            background-color: rgba(255, 255, 255, 0.8);
        }
        /* interaction: 게시글 추가 로딩 버튼의 hover·focus 상태 */
        .article-feed__load-button:hover,
        .article-feed__load-button:focus {
            border-color: rgba(49, 130, 246, 0.2);
            color: rgba(27, 100, 218, 1);
            background-color: rgba(235, 244, 255, 1);
        }
        .article-empty-state {
            padding: 4rem 1.5rem;
            border: 1px dashed rgba(15, 23, 42, 0.12);
            border-radius: 1.6rem;
            background-color: rgba(255, 255, 255, 0.72);
            text-align: center;
        }
        .article-empty-state__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            margin-bottom: 1rem;
            border-radius: 1.35rem;
            color: rgba(49, 130, 246, 1);
            background-color: rgba(235, 244, 255, 1);
            font-size: 1.4rem;
        }

        /* 반응형layout: 모바일 목록 도입부와 카드 메타데이터 밀도 조정 */
        @media (max-width: 575.98px) {
            #main-content .article-list-toolbar {
                margin-bottom: 1.25rem !important;
            }
            .article-list-toolbar__title-row {
                gap: 0.35rem;
                padding-bottom: 0;
            }
            .article-list-search {
                gap: 0.25rem;
                min-width: 2.5rem;
            }
            .article-list-search__toggle {
                flex-basis: 2.5rem;
                width: 2.5rem;
                height: 2.5rem;
            }
            .article-list-search.is-open .article-list-search__input {
                width: min(12rem, calc(100vw - 11rem));
                padding-right: 0.8rem;
                padding-left: 0.8rem;
            }
            .article-card__header {
                display: grid;
                grid-template-columns: max-content minmax(0, 1fr);
                align-items: center;
                gap: 0.5rem;
            }
            .article-card__byline {
                justify-content: flex-end;
                text-align: right;
            }
            .article-card__byline-main {
                white-space: normal;
                overflow-wrap: anywhere;
            }
            /* 반응형layout: 미사용 보존 - article-list-toolbar__symbol 마크업과 기본 규칙이 비활성 상태다.
            .article-list-toolbar__symbol {
                display: none;
            }
            */
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light project-shell tw:bg-canvas tw:text-ink tw:font-sans">
    <!-- 공통 헤더 -->
    <th:block th:replace="~{common :: siteHeader}"></th:block>

    <!-- 공통 네비게이션 -->
    <th:block th:replace="~{common :: siteNavbar(true)}"></th:block>

    <main id="main-content"
          class="container flex-fill py-4 py-md-5 tw:relative tw:z-0">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9 tw:max-w-4xl">

                <!-- 게시글 목록 상단 섹션(포스트) -->
                <section class="article-list-toolbar">
                    <div class="article-list-toolbar__heading">
                        <span class="article-list-toolbar__eyebrow">
                            <i class="bi bi-journal-richtext" aria-hidden="true"></i>
                            POSTS
                        </span>
                        <div class="article-list-toolbar__title-row">
                            <h2 class="article-list-toolbar__title">포스트</h2>
                            <form class="article-list-search"
                                  th:action="@{/articles}"
                                  method="get"
                                  role="search"
                                  data-article-search
                                  novalidate>
                                <label class="sr-only"
                                       for="article-list-search-input">포스트 검색</label>
                                <input id="article-list-search-input"
                                       class="article-list-search__input"
                                       type="search"
                                       name="keyword"
                                       placeholder="포스트 검색"
                                       autocomplete="off"
                                       enterkeyhint="search"
                                       tabindex="-1"
                                       aria-hidden="true">
                                <button class="article-list-search__toggle"
                                        type="submit"
                                        aria-controls="article-list-search-input"
                                        aria-expanded="false"
                                        aria-label="검색창 열기"
                                        title="검색창 열기">
                                    <i class="bi bi-search" aria-hidden="true"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </section>

                <!-- 게시글 카드 섹션 -->
                <section id="article-feed"
                    th:attr="data-next-cursor=${nextCursor},
                        data-has-next=${hasNextArticles}">
                    <a th:each="item : ${articles}"
                        th:href="@{/articles/{id}(id=${item.id})}"
                        class="article-card-link"> <!-- 게시글 카드 링크와 호버 효과 -->
                        <article class="card border-0 shadow-sm article-card">
                            <div class="card-body p-4 article-card__body">

                                <!-- 게시글 카드 1단 -->
                                <div class="article-card__header text-muted small mb-3"> <!-- 게시글 작성 일시와 작성자 정보 -->
                                    <div class="article-card__number"> <!-- 게시글 식별자와 고정 표시 -->
                                        <i th:if="${item.pinned}"
                                            class="bi bi-pin-angle-fill article-card__pin"
                                            aria-hidden="true"></i>
                                        <span th:if="${item.pinned}" class="sr-only">고정 게시글</span>
                                        <span th:text="|#${item.id}|"></span>
                                    </div>
                                    <div class="article-card__byline">
                                        <span class="article-card__byline-main">
                                            <span th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                            <span>by <span th:text="${item.author}"></span><i
                                                    th:if="${item.authorAdmin}"
                                                    class="bi bi-patch-check-fill author-admin-badge"
                                                    role="img"
                                                    aria-label="관리자"
                                                    title="관리자"></i></span>
                                        </span>
                                        <th:block th:if="${item.updatedAt != null
                                                and item.createdAt != null
                                                and item.updatedAt.isAfter(item.createdAt)}">
                                            <span class="article-card__separator"
                                                    aria-hidden="true">·</span>
                                            <span class="article-card__modified">수정됨</span>
                                        </th:block>
                                    </div>
                                </div>

                                <!-- 게시글 카드 2단 -->
                                <div>
                                    <h3 class="h5 mb-2 article-card__title"
                                        th:text="${item.title}"></h3> <!-- 게시글 제목 두 줄 말줄임 -->
                                    <p class="mb-0 text-secondary text-break article-card__preview"
                                        th:text="${item.content}"></p>
                                </div>

                                <!-- 게시글 카드 3단 -->
                                <div class="article-card__metrics justify-content-end text-muted small mt-3"> <!-- 게시글 조회수·좋아요·댓글 지표 -->
                                    <span class="article-card__metric" title="조회수">
                                        <i class="bi bi-eye" aria-hidden="true"></i>
                                        <span class="sr-only">조회수</span>
                                        <span class="article-card__view-count"
                                            th:text="${item.viewCount}"></span>
                                    </span>
                                    <span class="article-card__separator" aria-hidden="true">·</span>
                                    <span class="article-card__metric" title="좋아요">
                                        <i class="bi bi-heart-fill article-card__like-icon"
                                            aria-hidden="true"></i>
                                        <span class="sr-only">좋아요</span>
                                        <span class="article-card__like-count"
                                            th:text="${item.likeCount}"></span>
                                    </span>
                                    <span class="article-card__separator" aria-hidden="true">·</span>
                                    <span class="article-card__metric" title="댓글">
                                        <i class="bi bi-chat-dots" aria-hidden="true"></i>
                                        <span class="sr-only">댓글</span>
                                        <span class="article-card__comment-count"
                                            th:text="${item.commentCount}"></span>
                                    </span>
                                </div>

                            </div>
                        </article>
                    </a>
                </section>

                <!-- 검색 결과가 없을 때 표시할 섹션 -->
                <section id="article-search-empty-state"
                         class="article-empty-state mb-0"
                         role="status"
                         aria-live="polite"
                         aria-atomic="true"
                         hidden>
                    <span class="article-empty-state__icon" aria-hidden="true">
                        <i class="bi bi-search"></i>
                    </span>
                    <strong class="tw:block tw:text-lg tw:text-ink">검색된 결과가 없습니다</strong>
                    <span class="tw:mt-2 tw:block tw:text-sm tw:leading-6 tw:text-muted">
                        다른 검색어로 다시 검색해주세요
                    </span>
                    <a th:href="@{/new-article}"
                       class="btn btn-sm app-button site-nav__write tw:mt-5">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span>글쓰기</span>
                    </a>
                </section>

                <!-- 게시글이 없을 때 섹션 -->
                <section id="article-empty-state"
                         th:if="${#lists.isEmpty(articles)}"
                         class="article-empty-state mb-0">
                    <span class="article-empty-state__icon" aria-hidden="true">
                        <i class="bi bi-file-earmark-text"></i>
                    </span>
                    <strong class="tw:block tw:text-lg tw:text-ink">아직 작성된 포스트가 없습니다</strong>
                    <span class="tw:mt-2 tw:block tw:text-sm tw:leading-6 tw:text-muted">
                        게시글을 작성하면 이곳에 표시됩니다
                    </span>
                    <a th:href="@{/new-article}"
                       class="btn btn-sm app-button site-nav__write tw:mt-5">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span>글쓰기</span>
                    </a>
                </section>

                <!-- 게시글 로딩 섹션 -->
                <section class="article-feed__controls text-center py-3"
                    th:hidden="${!hasNextArticles}">  <!-- 게시글 추가 로딩 상태 -->
                    <div id="article-feed-loading"
                        class="text-muted small"
                        role="status"
                        hidden>
                        <span class="spinner-border spinner-border-sm mr-2"
                            aria-hidden="true"></span>
                        게시글을 불러오는 중입니다
                    </div>
                    <p id="article-feed-message"
                        class="text-muted small mb-2"
                        role="status"
                        aria-live="polite"
                        hidden></p>
                    <button id="article-feed-load-button"
                        type="button"
                        class="btn btn-outline-secondary btn-sm app-button article-feed__load-button"
                        hidden>
                        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                        <span>게시글 더보기</span>
                    </button>
                </section>

                <div id="article-feed-sentinel"
                    class="article-feed__sentinel"
                    aria-hidden="true">
                </div>
            </div>
        </div>
    </main>

    <!-- 공통 푸터 -->
    <th:block th:replace="~{common :: siteFooter}"></th:block>

    <script src="/js/siteNavigation.js"></script> <!-- 공통 내비게이션 고정 -->
    <script src="/js/articleSearch.js"></script> <!-- 게시글 검색 입력창 표시 -->
    <script src="/js/articleFeed.js"></script> <!-- 게시글 무한 스크롤 -->
</body>
</html>
