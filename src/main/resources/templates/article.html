<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title th:text="|${article.title} · NewTypeBlog|">글제목 · NewTypeBlog</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- favicon과 Bootstrap CSS -->
    <th:block th:replace="~{common :: styles}"></th:block> <!-- 공통 모듈 CSS -->
    <style>
        /* layout: 게시글 본문 타이포그래피와 반응형 첨부 콘텐츠 */
        .article-content img,
        .article-content iframe {
            max-width: 100%;
            border-radius: 1.1rem;
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
        }
        .article-content img {
            display: block;
            height: auto;
        }
        .article-content img + img {
            margin-top: 0.75rem;
        }
        .article-content iframe {
            aspect-ratio: 16 / 9;
            width: 100%;
            height: auto;
        }
        .article-content {
            color: rgba(51, 61, 75, 1);
            font-size: clamp(1rem, 2.5vw, 1.075rem);
            line-height: 1.9;
            letter-spacing: -0.012em;
        }
        .article-content > * + * {
            margin-top: 1.25em;
        }
        .article-content h1,
        .article-content h2,
        .article-content h3,
        .article-content h4 {
            margin-top: 1.8em;
            margin-bottom: 0.7em;
            color: rgba(25, 31, 40, 1);
            font-weight: 750;
            line-height: 1.35;
            letter-spacing: -0.035em;
        }
        .article-content blockquote {
            margin: 1.75rem 0;
            padding: 1rem 1.25rem;
            border-left: 4px solid rgba(49, 130, 246, 0.5);
            border-radius: 0 0.85rem 0.85rem 0;
            color: rgba(51, 61, 75, 1);
            background-color: rgba(235, 244, 255, 0.7);
        }
        .article-content pre {
            overflow-x: auto;
            padding: 1.1rem 1.25rem;
            border-radius: 1rem;
            color: rgba(226, 232, 240, 1);
            background-color: rgba(25, 31, 40, 1);
        }
        .article-content a {
            color: rgba(27, 100, 218, 1);
            text-decoration: underline;
            text-decoration-color: rgba(49, 130, 246, 0.35);
            text-underline-offset: 0.2em;
        }

        /* layout: 게시글 목록으로 돌아가기 링크 */
        .article-back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 1.25rem;
            padding: 0.55rem 0.8rem;
            border-radius: 999px;
            color: rgba(107, 118, 132, 1);
            font-size: 0.88rem;
            font-weight: 650;
            text-decoration: none;
            transition: color 0.18s ease, background-color 0.18s ease,
                transform 0.18s ease;
        }

        /* interaction: 목록 링크의 hover·focus 이동 효과 */
        .article-back-link:hover,
        .article-back-link:focus {
            color: rgba(27, 100, 218, 1);
            background-color: rgba(235, 244, 255, 1);
            text-decoration: none;
            transform: translateX(-2px);
        }

        /* 접근성: 목록 링크의 키보드 포커스 표시 */
        .article-back-link:focus-visible {
            outline: 3px solid rgba(49, 130, 246, 0.28);
            outline-offset: 3px;
        }

        /* layout: 게시글·댓글 카드의 공통 표면과 내부 여백 */
        .article-detail-card,
        .article-comments {
            border: 1px solid rgba(15, 23, 42, 0.07) !important;
            border-radius: 1.75rem;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.075) !important;
        }
        .article-detail-card__body,
        .article-comments__body {
            padding: clamp(1.4rem, 5vw, 3rem) !important;
        }
        #article-title {
            color: rgba(25, 31, 40, 1);
            font-size: clamp(2rem, 6vw, 3.15rem);
            font-weight: 780;
            line-height: 1.16;
            letter-spacing: -0.055em;
        }

        /* layout: 게시글 상단 고정 표시와 작성 정보 */
        .article-detail__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .article-detail__pin-marker {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            flex-shrink: 0;
            min-height: 1.85rem;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            color: rgba(107, 118, 132, 1);
            background-color: rgba(242, 244, 246, 1);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.02em;
        }
        .article-detail__pin-marker > i {
            color: rgba(49, 130, 246, 1);
            font-size: 0.85rem;
            line-height: 1;
        }
        .article-detail__pin-marker.is-hidden {
            visibility: hidden;
        }
        .article-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.35rem;
            min-width: 0;
            margin-left: auto;
            text-align: right;
            line-height: 1.55;
        }
        .article-meta__byline {
            white-space: nowrap;
        }
        .article-meta__separator {
            color: rgba(173, 181, 189, 1);
        }
        .author-admin-badge {
            margin-left: 0.2rem;
            color: rgba(29, 155, 240, 1);
            line-height: 1;
        }

        /* layout: 게시글 조회수·좋아요·댓글 지표 */
        .article-detail__metrics {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: nowrap;
            gap: 0.1rem;
            width: fit-content;
            max-width: 100%;
            margin-left: auto;
            padding: 0.15rem 0.25rem;
            border-radius: 999px;
            background-color: rgba(247, 249, 252, 1);
            text-align: right;
            white-space: nowrap;
        }
        .article-meta__metric {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            min-height: 1.9rem;
            padding: 0.25rem 0.45rem;
            background-color: transparent;
        }
        .article-meta__like-icon {
            color: rgba(224, 49, 49, 1);
        }

        /* layout: 게시글 좋아요 버튼 */
        .article-like {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .article-like__button {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-height: 3.15rem;
            padding: 0.65rem 1.15rem;
            border: 1px solid rgba(15, 23, 42, 0.09);
            color: rgba(51, 61, 75, 1);
            background-color: rgba(255, 255, 255, 1);
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
            font-weight: 680;
            transition: border-color 0.18s ease, color 0.18s ease,
                background-color 0.18s ease, transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        /* interaction: 좋아요 버튼의 hover·focus 상태 */
        .article-like__button:hover,
        .article-like__button:focus {
            border-color: rgba(224, 49, 49, 1);
            color: rgba(224, 49, 49, 1);
            background-color: rgba(255, 245, 246, 1);
            box-shadow: 0 12px 28px rgba(224, 49, 49, 0.11);
            transform: translateY(-1px);
        }

        /* 접근성: 좋아요·고정 버튼의 키보드 포커스 표시 */
        .article-like__button:focus-visible,
        .article-pin__button:focus-visible {
            outline: 3px solid rgba(49, 130, 246, 0.28);
            outline-offset: 3px;
        }

        /* interaction: 좋아요 버튼의 비활성·선택 상태 */
        .article-like__button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }
        .article-like__button.is-liked {
            border-color: rgba(224, 49, 49, 1);
            color: rgba(224, 49, 49, 1);
            background-color: rgba(255, 245, 246, 1);
        }
        .article-like__icon {
            font-size: 1.5rem;
            line-height: 1;
        }
        .article-like__count {
            min-width: 1ch;
            color: inherit;
            font-weight: 600;
        }

        /* layout: 게시글 고정 버튼 */
        .article-pin__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            min-width: 7rem;
            min-height: 3.15rem;
            padding: 0.65rem 1.05rem;
            border: 1px solid rgba(15, 23, 42, 0.09);
            color: rgba(108, 117, 125, 1);
            background-color: rgba(255, 255, 255, 1);
            transition: border-color 0.18s ease, color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
        }

        /* interaction: 고정 버튼의 hover·focus·선택 상태 */
        .article-pin__button:hover,
        .article-pin__button:focus,
        .article-pin__button.is-pinned {
            border-color: rgba(255, 193, 7, 1);
            color: rgba(133, 100, 4, 1);
            background-color: rgba(255, 249, 219, 1);
            outline: none;
        }
        .article-pin__button:hover,
        .article-pin__button:focus {
            transform: translateY(-1px);
        }

        /* interaction: 고정 버튼의 비활성 상태 */
        .article-pin__button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }
        .article-pin__icon {
            font-size: 1.25rem;
            line-height: 1;
        }

        /* layout: 게시글 수정·삭제 버튼과 상태 메시지 */
        .article-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .article-actions .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 2.75rem;
            padding: 0.55rem 0.9rem;
            font-weight: 650;
        }
        .article-actions__delete {
            border-color: rgba(225, 45, 63, 0.18);
            color: rgba(200, 38, 54, 1);
            background-color: rgba(255, 247, 248, 1);
        }
        .article-action-message {
            margin-top: 1rem;
            border: 0;
            border-radius: 0.9rem;
            font-size: 0.9rem;
        }

        /* layout: 댓글 작성 영역 */
        .article-comments__textarea {
            min-height: 7rem;
            padding: 1rem;
            border-color: rgba(15, 23, 42, 0.08);
            border-radius: 1rem;
            color: rgba(25, 31, 40, 1);
            background-color: rgba(247, 249, 252, 1);
            resize: vertical;
            transition: border-color 0.18s ease, box-shadow 0.18s ease,
                background-color 0.18s ease;
        }

        /* interaction: 댓글 입력 영역의 focus 상태 */
        .article-comments__textarea:focus {
            border-color: rgba(49, 130, 246, 0.42);
            background-color: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 4px rgba(49, 130, 246, 0.1);
        }
        .article-comments__submit {
            min-height: 2.75rem;
            padding: 0.55rem 1rem;
            border-color: rgba(49, 130, 246, 1);
            background-color: rgba(49, 130, 246, 1);
            font-weight: 680;
        }
        .article-comments__counter {
            font-variant-numeric: tabular-nums;
        }

        /* layout: 댓글 목록과 액션 버튼 */
        .comment-list {
            border-top: 1px solid rgba(233, 236, 239, 1);
        }
        .comment-item {
            padding: 1.25rem 0;
            border-bottom: 1px solid rgba(233, 236, 239, 1);
        }
        .comment-item__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.55rem;
        }
        .comment-item__author {
            color: rgba(52, 58, 64, 1);
            font-weight: 600;
        }
        .comment-item__date {
            color: rgba(134, 142, 150, 1);
            font-size: 0.82rem;
        }
        .comment-item__content {
            margin-bottom: 0.65rem;
            color: rgba(73, 80, 87, 1);
            line-height: 1.65;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .comment-item__content--deleted {
            color: rgba(134, 142, 150, 1);
            font-style: italic;
        }
        .comment-item__actions {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .comment-item__actions .btn {
            min-height: 2.5rem;
            padding: 0.45rem 0.65rem;
            font-size: 0.82rem;
            font-weight: 650;
            text-decoration: none;
        }

        /* layout: 대댓글과 인라인 작성·수정 폼 */
        .comment-replies {
            margin-top: 1rem;
            margin-left: 2rem;
            padding-left: 1rem;
            border-left: 3px solid rgba(191, 219, 254, 1);
        }
        .comment-replies .comment-item {
            padding: 1rem;
            border: 0;
            border-radius: 0.65rem;
            background-color: rgba(247, 249, 252, 1);
        }
        .comment-replies .comment-item + .comment-item {
            margin-top: 0.75rem;
        }
        .comment-inline-form {
            margin-top: 0.9rem;
            padding: 0.9rem;
            border-radius: 0.65rem;
            background-color: rgba(247, 249, 252, 1);
        }
        .comment-inline-form textarea {
            min-height: 5.5rem;
            resize: vertical;
        }
        .comment-inline-form__controls {
            gap: 0.6rem;
        }
        .comment-inline-form__actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
        }
        .comment-inline-form__button {
            min-height: 2.75rem;
            padding: 0.55rem 1rem;
            border-width: 1px;
            font-weight: 650;
        }

        /* 반응형layout: 모바일 메타데이터·액션 버튼·대댓글 밀도 조정 */
        @media (max-width: 575.98px) {
            .article-back-link {
                margin-bottom: 0.6rem;
                padding: 0.3rem 0.45rem;
                font-size: 0.8rem;
            }
            #article-title { /* 모바일에서 제목 크기 조정 */
                font-size: clamp(1.35rem, 4.5vw, 1.65rem);
            }
            .article-detail__header {
                display: grid;
                grid-template-columns: max-content minmax(0, 1fr);
                align-items: center;
                gap: 0.5rem;
            }
            .article-meta {
                grid-column: 2;
                justify-content: flex-end;
                margin-left: 0;
                text-align: right;
            }
            .article-meta__byline {
                white-space: normal;
                overflow-wrap: anywhere;
            }
            .article-detail__metrics {
                justify-content: flex-end;
                text-align: right;
            }
            .article-actions,
            .comment-inline-form__actions {
                gap: 0.25rem;
            }
            .article-actions .btn,
            .article-comments__submit,
            .comment-inline-form__button {
                width: 3.5rem;
                min-width: 3.5rem;
                min-height: 2.25rem;
                padding: 0.35rem 0.25rem;
                font-size: 0.8rem;
                line-height: 1.2;
            }
            .comment-item__actions {
                flex-wrap: nowrap;
                gap: 0;
            }
            .comment-item__actions .btn {
                width: 3rem;
                min-width: 3rem;
                min-height: 2.25rem;
                padding: 0.3rem 0.15rem;
                gap: 0.2rem;
                font-size: 0.8rem;
                line-height: 1.2;
            }
            .article-actions .btn > i,
            .article-comments__submit > i,
            .comment-item__actions .btn > i,
            .comment-inline-form__button > i {
                display: none;
            }
            .comment-replies {
                margin-left: 0.5rem;
                padding-left: 0.75rem;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light project-shell tw:bg-canvas tw:text-ink tw:font-sans">
    <!-- 공통 헤더 섹션 -->
    <th:block th:replace="~{common :: siteHeader}"></th:block>

    <!-- 공통 네비게이션 섹션 -->
    <th:block th:replace="~{common :: siteNavbar(true)}"></th:block>

    <main id="main-content"
        class="container flex-fill py-4 py-md-5 tw:relative tw:z-0">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9 tw:max-w-4xl">
                <a th:href="@{/articles}" class="article-back-link">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    모든 포스트
                </a>

                <!-- 게시글 섹션 -->
                <section class="card border-0 shadow-sm article-detail-card"
                        id="article-detail"
                        aria-labelledby="article-title">
                    <div class="card-body p-4 p-md-5 article-detail-card__body">
                        <input type="hidden" id="article-id" th:value="${article.id}">

                        <!-- 게시글 헤더 영역(제목 상단) -->
                        <div class="article-detail__header mb-4">
                            <span id="article-pinned-marker"
                                    class="article-detail__pin-marker"
                                    th:classappend="${article.pinned} ? '' : ' is-hidden'"
                                    th:attr="aria-hidden=${!article.pinned}">
                                <i class="bi bi-pin-angle-fill" aria-hidden="true"></i>
                                <span class="sr-only">고정 게시글</span> 
                            </span>
                            <div class="text-muted small article-meta">
                                <span class="article-meta__byline">
                                    <span th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                    <span>by <span th:text="${article.author}"></span><i
                                            th:if="${article.authorAdmin}"
                                            class="bi bi-patch-check-fill author-admin-badge"
                                            role="img"
                                            aria-label="관리자"
                                            title="관리자"></i></span>
                                </span>
                                <th:block th:if="${article.updatedAt != null
                                        and article.createdAt != null
                                        and article.updatedAt.isAfter(article.createdAt)}">
                                    <span class="article-meta__separator" aria-hidden="true">·</span>
                                    <span id="article-modified">수정됨</span>
                                </th:block>
                            </div>
                        </div>

                        <!-- 게시글 메인 영역 -->
                        <article>
                            <header class="border-bottom pb-3 mb-4">
                                <h1 id="article-title"
                                    class="h4 mb-0 text-break"
                                    th:text="${article.title}"></h1> <!-- 게시글 제목 -->
                            </header>
                            <section class="mb-4">
                                <div class="mb-0 text-break article-content tw:max-w-none"
                                    th:utext="${article.content}"></div> <!-- 게시글 본문 -->

                                <!-- 게시글 조회수·좋아요·댓글 영역 -->
                                <div class="article-detail__metrics text-muted small mt-4">
                                    <span class="article-meta__metric" title="조회수">
                                        <i class="bi bi-eye" aria-hidden="true"></i>
                                        <span class="sr-only">조회수</span>
                                        <span id="article-view-count" th:text="${article.viewCount}"></span>
                                    </span>
                                    <span class="article-meta__separator" aria-hidden="true">·</span>
                                    <span class="article-meta__metric" title="좋아요">
                                        <i class="bi bi-heart-fill article-meta__like-icon"
                                            aria-hidden="true"></i>
                                        <span class="sr-only">좋아요</span>
                                        <span id="article-like-count" th:text="${article.likeCount}"></span>
                                    </span>
                                    <span class="article-meta__separator" aria-hidden="true">·</span>
                                    <span class="article-meta__metric" title="댓글">
                                        <i class="bi bi-chat-dots" aria-hidden="true"></i>
                                        <span class="sr-only">댓글</span>
                                        <span id="article-comment-count"
                                                th:text="${article.commentCount}"></span>
                                    </span>
                                </div>

                            </section>

                            <!-- 게시글 좋아요·고정 버튼 영역 -->
                            <div class="article-like border-top pt-4 mb-4">
                                <button type="button" id="like-btn"
                                        class="app-button article-like__button"
                                        aria-label="좋아요"
                                        aria-pressed="false"
                                        disabled>
                                    <i id="like-icon"
                                        class="bi bi-heart article-like__icon"
                                        aria-hidden="true"></i>
                                    <span>좋아요</span>
                                    <span id="like-count"
                                        class="article-like__count"
                                        th:text="${article.likeCount}">0</span>
                                </button>
                                <button type="button" id="pin-btn"
                                        th:if="${isAdmin}"
                                        class="app-button article-pin__button"
                                        th:classappend="${article.pinned} ? ' is-pinned'"
                                        th:attr="data-pinned=${article.pinned},
                                                aria-pressed=${article.pinned},
                                                aria-label=${article.pinned} ? '글 고정 해제' : '글 고정'">
                                    <i id="pin-icon"
                                        class="bi article-pin__icon"
                                        th:classappend="${article.pinned} ? ' bi-pin-angle-fill' : ' bi-pin-angle'"
                                        aria-hidden="true"></i>
                                    <span id="pin-label"
                                        th:text="${article.pinned} ? '해제' : '고정'"></span>
                                </button>
                            </div>

                            <!-- 게시글 수정·삭제 버튼 영역 -->
                            <div class="article-actions" th:if="${canManageArticle}">
                                <a id="edit-btn"
                                    th:href="@{/new-article(id=${article.id})}"
                                    class="btn btn-primary btn-sm app-button">
                                    <i class="bi bi-pencil" aria-hidden="true"></i>
                                    <span>수정</span>
                                </a>
                                <button type="button" id="delete-btn"
                                        class="btn btn-sm app-button article-actions__delete">
                                    <i class="bi bi-trash3" aria-hidden="true"></i>
                                    <span>삭제</span>
                                </button>
                            </div>
                            <div id="article-action-message"
                                class="alert d-none article-action-message"
                                role="status"
                                aria-live="polite">
                            </div>

                        </article>

                    </div>
                </section>

                <!-- 댓글 섹션 -->
                <section class="card border-0 shadow-sm mt-4 article-comments"
                        id="article-comments"
                        aria-labelledby="comment-heading">
                    <div class="card-body p-4 p-md-5 article-comments__body">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h2 class="h5 mb-0" id="comment-heading">
                                댓글
                                <span id="comment-count" class="text-muted tw:ml-1">0</span>
                            </h2>
                        </div>

                        <!-- 댓글 작성 영역 -->
                        <form id="comment-form" novalidate>
                            <label class="sr-only" for="comment-content">내용</label>
                            <textarea id="comment-content"
                                    class="form-control article-comments__textarea"
                                    data-max-length="1000"
                                    placeholder="댓글을 입력해주세요"
                                    aria-describedby="comment-length"
                                    required></textarea>
                            <div class="d-flex align-items-center justify-content-between mt-2">
                                <span id="comment-length"
                                    class="small text-muted article-comments__counter">0 / 1000</span>
                                <button type="submit"
                                        id="comment-submit"
                                        class="btn btn-primary btn-sm app-button article-comments__submit">
                                    <i class="bi bi-send" aria-hidden="true"></i>
                                    <span>등록</span>
                                </button>
                            </div>
                        </form>

                        <!-- 댓글 목록 영역 -->
                        <div id="comment-message"
                            class="alert d-none mt-3 mb-0"
                            role="status"
                            aria-live="polite">
                        </div>
                        <div id="comment-loading"
                            class="py-4 text-center text-muted">
                            <span class="spinner-border spinner-border-sm mr-2"
                                    aria-hidden="true"></span>
                            댓글을 불러오는 중입니다
                        </div>
                        <div id="comment-list" class="comment-list d-none"></div> <!-- 댓글 목록 렌더링 -->
                        <p id="comment-empty"
                            class="d-none py-4 mb-0 text-center text-muted">
                            <i class="bi bi-chat-square-text tw:mb-2 tw:block tw:text-2xl"
                                aria-hidden="true"></i>
                            아직 작성된 댓글이 없습니다
                        </p>

                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- 공통 푸터 섹션 -->
    <th:block th:replace="~{common :: siteFooter}"></th:block>

    <script src="/js/siteNavigation.js"></script> <!-- 스크롤 위치에 따른 공통 내비게이션 고정 상태 표시 -->
    <script src="/js/articleLike.js?v=2"></script> <!-- 게시글 좋아요 조회·등록·취소와 개수 갱신(캐시 갱신용 ?v=2) -->
    <script src="/js/articlePin.js"></script> <!-- 관리자용 게시글 고정·해제와 화면 상태 갱신 -->
    <script src="/js/articleComment.js"></script> <!-- 댓글·대댓글 조회·작성·수정·삭제와 화면 렌더링 -->
    <script src="/js/articleDelete.js"></script> <!-- 게시글 삭제와 삭제 후 목록 이동 -->
</body>
</html>
