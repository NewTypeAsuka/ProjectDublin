<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title>✨NewTypeBlog::포스트✨</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- 사이트 공통 favicon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"> <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> <!-- Bootstrap Icons CSS -->
    <th:block th:replace="~{common :: styles}"></th:block>
    <style>
        .article-content iframe {
            max-width: 100%;
        }
        .article-content img {
            max-width: 100%;
            height: auto;
        }
        .article-content iframe {
            aspect-ratio: 16 / 9;
            width: 100%;
            height: auto;
        }
        .article-detail__header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }
        .article-detail__pin-marker {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            color: #ffc107;
            font-size: 1rem;
            line-height: 1;
        }
        .article-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.35rem;
            min-width: 0;
            margin-left: auto;
            text-align: right;
        }
        .article-meta__byline {
            white-space: nowrap;
        }
        .article-meta__separator {
            color: #adb5bd;
        }
        .article-detail__metrics {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.35rem;
            text-align: right;
        }
        .article-meta__metric {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .author-admin-badge {
            margin-left: 0.2rem;
            color: rgba(29, 155, 240, 1);
            line-height: 1;
        }
        .article-meta__like-icon {
            color: #e03131;
        }
        .article-like {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .article-like__button {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.55rem 0.9rem;
            border: 1px solid #dee2e6;
            border-radius: 999px;
            color: #6c757d;
            background-color: #ffffff;
            transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }
        .article-like__button:hover,
        .article-like__button:focus {
            border-color: #e03131;
            color: #e03131;
            outline: none;
            transform: translateY(-1px);
        }
        .article-like__button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }
        .article-like__button.is-liked {
            border-color: #e03131;
            color: #e03131;
        }
        .article-like__icon {
            font-size: 1.5rem;
            line-height: 1;
        }
        .article-like__count {
            min-width: 1ch;
            color: inherit;
            font-weight: 600;
        }
        .article-pin__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            min-width: 6.5rem;
            padding: 0.55rem 0.9rem;
            border: 1px solid #dee2e6;
            border-radius: 999px;
            color: #6c757d;
            background-color: #ffffff;
            transition: border-color 0.18s ease, color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
        }
        .article-pin__button:hover,
        .article-pin__button:focus,
        .article-pin__button.is-pinned {
            border-color: #ffc107;
            color: #856404;
            background-color: #fff9db;
            outline: none;
        }
        .article-pin__button:hover,
        .article-pin__button:focus {
            transform: translateY(-1px);
        }
        .article-pin__button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }
        .article-pin__icon {
            font-size: 1.5rem;
            line-height: 1;
        }
        .article-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .article-comments__textarea {
            min-height: 7rem;
            resize: vertical;
        }
        .article-comments__counter {
            font-variant-numeric: tabular-nums;
        }
        .comment-list {
            border-top: 1px solid #e9ecef;
        }
        .comment-item {
            padding: 1.25rem 0;
            border-bottom: 1px solid #e9ecef;
        }
        .comment-item__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.55rem;
        }
        .comment-item__author {
            color: #343a40;
            font-weight: 600;
        }
        .comment-item__date {
            color: #868e96;
            font-size: 0.82rem;
        }
        .comment-item__content {
            margin-bottom: 0.65rem;
            color: #495057;
            line-height: 1.65;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .comment-item__content--deleted {
            color: #868e96;
            font-style: italic;
        }
        .comment-item__actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .comment-item__actions .btn {
            padding: 0.15rem 0.45rem;
            font-size: 0.78rem;
        }
        .comment-replies {
            margin-top: 1rem;
            margin-left: 2rem;
            padding-left: 1rem;
            border-left: 3px solid #e9ecef;
        }
        .comment-replies .comment-item {
            padding: 1rem;
            border: 0;
            border-radius: 0.65rem;
            background-color: #f8f9fa;
        }
        .comment-replies .comment-item + .comment-item {
            margin-top: 0.75rem;
        }
        .comment-inline-form {
            margin-top: 0.9rem;
            padding: 0.9rem;
            border-radius: 0.65rem;
            background-color: #f8f9fa;
        }
        .comment-inline-form textarea {
            min-height: 5.5rem;
            resize: vertical;
        }
        @media (max-width: 575.98px) {
            .comment-replies {
                margin-left: 0.5rem;
                padding-left: 0.75rem;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <th:block th:replace="~{common :: siteHeader}"></th:block>

    <th:block th:replace="~{common :: siteNavbar(true)}"></th:block>

    <main class="container flex-fill py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9">
                <section class="card border-0 shadow-sm article-detail-card" id="article-detail" aria-labelledby="article-title"> <!-- 글 영역 -->
                    <div class="card-body p-4 p-md-5">
                        <input type="hidden" id="article-id" th:value="${article.id}">
                        <div class="article-detail__header mb-4">
                            <span id="article-pinned-marker"
                                  class="article-detail__pin-marker"
                                  th:classappend="${article.pinned} ? '' : ' d-none'">
                                <i class="bi bi-pin-angle-fill" aria-hidden="true"></i>
                                <span class="sr-only">고정 게시글</span>
                            </span>
                            <div class="text-muted small article-meta">
                                <span class="article-meta__byline">
                                    <span th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                    <span>by <span th:text="${article.author}"></span><i
                                            th:if="${article.authorAdmin}"
                                            class="bi bi-patch-check-fill author-admin-badge"
                                            role="img"
                                            aria-label="관리자"
                                            title="관리자"></i></span>
                                </span>
                                <th:block th:if="${article.updatedAt != null
                                        and article.createdAt != null
                                        and article.updatedAt.isAfter(article.createdAt)}">
                                    <span class="article-meta__separator" aria-hidden="true">·</span>
                                    <span id="article-modified">수정됨</span>
                                </th:block>
                            </div>
                        </div>

                        <article>
                            <header class="border-bottom pb-3 mb-4">
                                <h1 id="article-title"
                                    class="h3 mb-0 text-break"
                                    th:text="${article.title}"></h1>
                            </header>
                            <section class="mb-4">
                                <div class="mb-0 text-break article-content" th:utext="${article.content}"></div>
                                <div class="article-detail__metrics text-muted small mt-4">
                                    <span class="article-meta__metric" title="조회수">
                                        <i class="bi bi-eye" aria-hidden="true"></i>
                                        <span class="sr-only">조회수</span>
                                        <span id="article-view-count" th:text="${article.viewCount}"></span>
                                    </span>
                                    <span class="article-meta__separator" aria-hidden="true">·</span>
                                    <span class="article-meta__metric" title="좋아요">
                                        <i class="bi bi-heart-fill article-meta__like-icon"
                                           aria-hidden="true"></i>
                                        <span class="sr-only">좋아요</span>
                                        <span id="article-like-count" th:text="${article.likeCount}"></span>
                                    </span>
                                    <span class="article-meta__separator" aria-hidden="true">·</span>
                                    <span class="article-meta__metric" title="댓글">
                                        <i class="bi bi-chat-dots" aria-hidden="true"></i>
                                        <span class="sr-only">댓글</span>
                                        <span id="article-comment-count"
                                              th:text="${article.commentCount}"></span>
                                    </span>
                                </div>
                            </section>
                            <div class="article-like border-top pt-4 mb-4">
                                <button type="button" id="like-btn"
                                        class="article-like__button"
                                        aria-label="좋아요"
                                        aria-pressed="false"
                                        disabled>
                                    <i id="like-icon"
                                       class="bi bi-heart article-like__icon"
                                       aria-hidden="true"></i>
                                    <span>좋아요</span>
                                    <span id="like-count" class="article-like__count">0</span>
                                </button>
                                <button type="button" id="pin-btn"
                                        th:if="${isAdmin}"
                                        class="article-pin__button"
                                        th:classappend="${article.pinned} ? ' is-pinned'"
                                        th:attr="data-pinned=${article.pinned},
                                                 aria-pressed=${article.pinned},
                                                 aria-label=${article.pinned} ? '글 고정 해제' : '글 고정'">
                                    <i id="pin-icon"
                                       class="bi article-pin__icon"
                                       th:classappend="${article.pinned} ? ' bi-pin-angle-fill' : ' bi-pin-angle'"
                                       aria-hidden="true"></i>
                                    <span id="pin-label"
                                          th:text="${article.pinned} ? '해제' : '고정'"></span>
                                </button>
                            </div>
                            <div class="article-actions" th:if="${canManageArticle}">
                                <button type="button" id="edit-btn"
                                        th:onclick="|location.href='@{/new-article?id={articleId}(articleId=${article.id})}'|"
                                        class="btn btn-primary btn-sm">수정</button>
                                <button type="button" id="delete-btn"
                                        class="btn btn-outline-secondary btn-sm">삭제</button>
                            </div>
                        </article>
                    </div>
                </section>

                <section class="card border-0 shadow-sm mt-4 article-comments" id="article-comments" aria-labelledby="comment-heading"> <!-- 댓글 섹션 -->
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h2 class="h5 mb-0" id="comment-heading">
                                댓글 <span id="comment-count" class="text-muted">0</span>
                            </h2>
                        </div>

                        <form id="comment-form" novalidate>
                            <label class="sr-only" for="comment-content">댓글 내용</label>
                            <textarea id="comment-content"
                                      class="form-control article-comments__textarea"
                                      data-max-length="1000"
                                      placeholder="댓글을 입력해주세요"
                                      aria-describedby="comment-length"
                                      required></textarea>
                            <div class="d-flex align-items-center justify-content-between mt-2">
                                <span id="comment-length"
                                      class="small text-muted article-comments__counter">0 / 1000</span>
                                <button type="submit"
                                        id="comment-submit"
                                        class="btn btn-primary btn-sm">댓글 등록</button>
                            </div>
                        </form>

                        <div id="comment-message"
                             class="alert d-none mt-3 mb-0"
                             role="status"
                             aria-live="polite"></div>
                        <div id="comment-loading"
                             class="py-4 text-center text-muted">댓글을 불러오는 중입니다...</div>
                        <div id="comment-list" class="comment-list d-none"></div>
                        <p id="comment-empty"
                           class="d-none py-4 mb-0 text-center text-muted">
                            아직 작성된 댓글이 없습니다.
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <th:block th:replace="~{common :: siteFooter}"></th:block>

    <script>
        const siteHeader = document.querySelector('.site-header');
        const siteNav = document.getElementById('site-nav');

        if (siteHeader && siteNav) {
            const syncStickyNavState = function () {
                siteNav.classList.toggle('is-stuck', siteHeader.getBoundingClientRect().bottom <= 0);
            };

            syncStickyNavState();
            window.addEventListener('scroll', syncStickyNavState, { passive: true });
            window.addEventListener('resize', syncStickyNavState);
        }
    </script>
    <script src="/js/articleLike.js?v=2"></script>
    <script src="/js/articlePin.js"></script>
    <script src="/js/articleComment.js"></script>
    <script src="/js/article.js"></script>
</body>
</html>
