<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title th:text="${article.id} != null ? '글 수정 · NewTypeBlog' : '새 글 작성 · NewTypeBlog'">새 글 작성 · NewTypeBlog</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- favicon과 Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs4.min.css"> <!-- Summernote CSS -->
    <th:block th:replace="~{common :: styles}"></th:block>
    <style>
        .editor-shell {
            position: relative;
        }
        .editor-shell::before {
            content: '';
            position: absolute;
            top: 1.5rem;
            left: 50%;
            width: min(50rem, 90vw);
            height: 18rem;
            border-radius: 999px;
            background: radial-gradient(circle,
                rgba(49, 130, 246, 0.1) 0%,
                rgba(49, 130, 246, 0) 70%);
            filter: blur(10px);
            transform: translateX(-50%);
            pointer-events: none;
        }
        .editor-intro {
            position: relative;
            max-width: 52rem;
            margin: 0 auto 1.75rem;
        }
        .editor-intro__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.65rem;
            color: rgba(49, 130, 246, 1);
            font-size: 0.75rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .editor-intro__title {
            margin-bottom: 0.7rem;
            color: rgba(25, 31, 40, 1);
            font-size: clamp(2rem, 6vw, 3.25rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.055em;
        }
        /* Summernote의 드롭다운이 작성 카드 경계에서 잘리지 않도록 한다. */
        .editor-card {
            position: relative;
            overflow: visible;
            border: 1px solid rgba(15, 23, 42, 0.07) !important;
            border-radius: 1.75rem;
            background-color: rgba(255, 255, 255, 0.92);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .editor-card::before {
            content: '';
            display: block;
            height: 0.28rem;
            border-radius: 1.75rem 1.75rem 0 0;
            background: linear-gradient(90deg,
                rgba(49, 130, 246, 1),
                rgba(92, 124, 250, 1),
                rgba(49, 130, 246, 0.35));
        }
        .editor-card__body {
            padding: clamp(1.35rem, 4vw, 3.25rem) !important;
        }
        .editor-field {
            margin-bottom: 2rem;
        }
        /* 제목과 본문 사이 간격만 별도로 축소 */
        .editor-field--title {
            margin-bottom: 1rem !important;
        }
        .editor-field__label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.75rem;
            color: rgba(25, 31, 40, 1);
            font-size: 0.95rem;
            font-weight: 700;
        }
        .editor-field__title {
            font-size: 1.05rem;
        }
        .editor-title-input {
            min-height: 4rem;
            padding: 0.85rem 1rem;
            border: 1px solid rgba(15, 23, 42, 0.09);
            border-radius: 1rem;
            color: rgba(25, 31, 40, 1);
            background-color: rgba(247, 249, 252, 1);
            font-size: clamp(1.2rem, 3vw, 1.55rem);
            font-weight: 700;
            letter-spacing: -0.025em;
            transition: border-color 0.18s ease, box-shadow 0.18s ease,
                background-color 0.18s ease;
        }
        .editor-title-input::placeholder {
            color: rgba(139, 149, 161, 1);
        }
        .editor-title-input:focus {
            border-color: rgba(49, 130, 246, 0.45);
            color: rgba(25, 31, 40, 1);
            background-color: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 4px rgba(49, 130, 246, 0.1);
        }

        /* 게시글 제목 글자 수와 제한 안내 */
        .article-title__counter {
            font-variant-numeric: tabular-nums;
        }
        .article-title__feedback {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .article-title__feedback {
            justify-content: flex-end;
        }
        .article-title__feedback .text-muted {
            color: rgba(107, 118, 132, 1) !important;
        }

        /* Summernote를 집중형 에디터 카드와 같은 톤으로 표시 */
        .note-editor.note-frame {
            overflow: visible;
            border: 1px solid rgba(15, 23, 42, 0.09);
            border-radius: 1rem;
            box-shadow: none;
        }
        .note-editor.note-frame .note-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid rgba(15, 23, 42, 0.07);
            border-radius: 1rem 1rem 0 0;
            background-color: rgba(247, 249, 252, 1);
        }
        .note-editor.note-frame .note-btn-group {
            margin: 0;
        }
        .note-editor.note-frame .note-btn {
            min-width: 2.4rem;
            min-height: 2.4rem;
            border-color: transparent;
            border-radius: 0.65rem;
            color: rgba(51, 61, 75, 1);
            background-color: transparent;
        }
        .note-editor.note-frame .note-btn:hover,
        .note-editor.note-frame .note-btn:focus,
        .note-editor.note-frame .note-btn.active {
            border-color: rgba(49, 130, 246, 0.1);
            color: rgba(27, 100, 218, 1);
            background-color: rgba(235, 244, 255, 1);
            box-shadow: none;
        }
        .note-editor.note-frame .note-editing-area {
            overflow: hidden;
            background-color: rgba(255, 255, 255, 1);
        }
        .note-editor.note-frame .note-editable {
            min-height: 30rem;
            padding: clamp(1.1rem, 3vw, 1.75rem);
            color: rgba(51, 61, 75, 1);
            font-size: 1.05rem;
            line-height: 1.85;
        }
        .note-editor.note-frame .note-statusbar {
            border-top: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 0 0 1rem 1rem;
            background-color: rgba(247, 249, 252, 1);
        }
        #image-upload-status {
            min-height: 1.4rem;
            padding-left: 0.2rem;
        }
        .editor-form-message {
            border: 0;
            border-radius: 0.9rem;
            font-size: 0.9rem;
        }
        .editor-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-top: 2rem;
        }
        .editor-actions .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            width: 7rem;
            min-height: 2.9rem;
            margin-bottom: 0 !important;
            padding: 0.6rem 1rem;
            border-radius: 999px;
            font-weight: 680;
        }
        .editor-actions__cancel {
            border-color: rgba(15, 23, 42, 0.08);
            color: rgba(51, 61, 75, 1);
            background-color: rgba(247, 249, 252, 1);
        }
        .editor-actions__submit {
            border-color: rgba(49, 130, 246, 1);
            color: rgba(255, 255, 255, 1);
            background-color: rgba(49, 130, 246, 1);
            box-shadow: 0 10px 24px rgba(49, 130, 246, 0.24);
        }
        .editor-actions__submit:hover,
        .editor-actions__submit:focus {
            border-color: rgba(27, 100, 218, 1);
            color: rgba(255, 255, 255, 1);
            background-color: rgba(27, 100, 218, 1);
            transform: translateY(-1px);
        }
        .editor-actions__submit:focus-visible,
        .editor-actions__cancel:focus-visible {
            outline: 3px solid rgba(49, 130, 246, 0.28);
            outline-offset: 3px;
        }
        @media (max-width: 575.98px) {
            .editor-shell::before {
                top: 0;
                height: 12rem;
            }
            .editor-intro {
                margin-bottom: 1.25rem;
            }
            .editor-card {
                border-radius: 1.25rem;
            }
            .editor-card::before {
                border-radius: 1.25rem 1.25rem 0 0;
            }
            .editor-field__label {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.25rem;
            }
            /* 가로 스크롤은 드롭다운까지 자르므로 모바일에서는 툴바를 여러 줄로 배치한다. */
            .note-editor.note-frame .note-toolbar {
                overflow: visible;
                flex-wrap: wrap;
            }
            .note-editor.note-frame .note-editable {
                min-height: 22rem;
            }
            .editor-actions {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .editor-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light project-shell tw:bg-canvas tw:text-ink tw:font-sans">
    <th:block th:replace="~{common :: siteHeader}"></th:block>

    <th:block th:replace="~{common :: siteNavbar(false)}"></th:block> <!-- 글쓰기 버튼의 경우 newArticle에서는 렌더링 안되게 처리 -->

    <main id="main-content"
          class="container flex-fill py-4 py-md-5 editor-shell tw:relative tw:z-0">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9 tw:max-w-5xl">
                <header class="editor-intro">
                    <p class="editor-intro__eyebrow">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span th:text="${article.id} != null ? 'EDIT' : 'WRITE'">WRITE</span>
                    </p>
                    <h2 class="editor-intro__title"
                        th:text="${article.id} != null ? '글수정' : '글쓰기'">
                        글쓰기
                    </h2>
                </header>
                <!-- 게시글 작성·수정 카드 -->
                <div class="card border-0 shadow-sm editor-card">
                    <div class="card-body p-4 p-md-5 editor-card__body">
                        <form id="article-form" novalidate>
                            <input type="hidden" id="article-id" th:value="${article.id}"> <!-- 아이디 정보 저장 -->
                            <!-- <header class="mb-4">
                                <div class="text-uppercase text-muted small mb-2">Editor</div>
                                <h2 class="h4 mb-0" th:text="${article.id} != null ? '글 수정' : '새 글 작성'">새 글 작성</h2>
                            </header> -->
                            <section>
                                <!-- 게시글 제목 글자 수와 40자 제한 안내 -->
                                <div class="form-group mb-4 editor-field editor-field--title">
                                    <label for="title" class="editor-field__label">
                                        <span class="editor-field__title">제목</span>
                                    </label>
                                    <input type="text"
                                           class="form-control editor-title-input"
                                           placeholder="제목을 입력해주세요"
                                           id="title"
                                           data-max-length="40"
                                           aria-describedby="title-length title-error"
                                           autocomplete="off"
                                           required
                                           th:value="${article.title}">
                                    <div class="article-title__feedback mt-2" aria-live="polite">
                                        <small id="title-length"
                                               class="text-muted article-title__counter">0 / 40</small>
                                        <small id="title-error"
                                               class="d-none text-danger"
                                               aria-hidden="true">제목은 40자 이내로 작성해주세요</small>
                                    </div>
                                </div>

                                <!-- Summernote 본문과 이미지 업로드 상태 -->
                                <div class="form-group mb-4 editor-field">
                                    <label for="content" class="editor-field__label">
                                        <span class="editor-field__title">본문</span>
                                    </label>
                                    <textarea class="form-control" rows="12" placeholder="내용" id="content" th:text="${article.content}"></textarea>
                                    <small id="image-upload-status"
                                           class="d-block mt-2 text-muted"
                                           aria-live="polite"></small>
                                </div>
                            </section>

                            <div id="article-form-message"
                                 class="alert d-none editor-form-message"
                                 role="status"
                                 aria-live="polite"></div>

                            <!-- 게시글 등록·수정 버튼 -->
                            <div class="editor-actions">
                                <a th:if="${article.id} != null"
                                   th:href="@{/articles/{id}(id=${article.id})}"
                                   class="btn app-button editor-actions__cancel">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                    <span>취소</span>
                                </a>
                                <a th:if="${article.id} == null"
                                   th:href="@{/articles}"
                                   class="btn app-button editor-actions__cancel">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                    <span>취소</span>
                                </a>
                                <button th:if="${article.id} != null"
                                        type="submit"
                                        id="modify-btn"
                                        class="btn btn-primary app-button editor-actions__submit">
                                    <i class="bi bi-check2" aria-hidden="true"></i>
                                    <span>수정</span>
                                </button> <!-- id가 있을 때는 수정 버튼을, id가 없을 때는 등록 버튼을 보여줍니다. -->
                                <button th:if="${article.id} == null"
                                        type="submit"
                                        id="create-btn"
                                        class="btn btn-primary app-button editor-actions__submit">
                                    <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
                                    <span>등록</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{common :: siteFooter}"></th:block>

    <!-- Summernote 사용을 위한 외부 스크립트 -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/lang/summernote-ko-KR.min.js"></script>

    <script src="/js/siteNavigation.js"></script>  <!-- 공통 내비게이션 고정 -->
    <script src="/js/summernote.js"></script> <!-- Summernote 본문과 이미지 업로드 -->
    <script src="/js/articleForm.js"></script> <!-- 게시글 작성·수정과 제목 글자 수 제한 -->
</body>
</html>
