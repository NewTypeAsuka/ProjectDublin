<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title th:text="${article.id} != null
        ? #{article.form.page.edit.title}
        : #{article.form.page.create.title}">글쓰기 · NewTypeBlog</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- favicon과 공통 CSS·보안 스크립트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs4.min.css"> <!-- Summernote CSS -->
    <link rel="stylesheet" href="/css/newArticle.css"> <!-- 게시글 작성·수정 화면 CSS -->
</head>
<body class="d-flex flex-column min-vh-100 bg-light project-shell tw:bg-canvas tw:text-ink tw:font-sans"
    data-language-change-dirty="false"
    th:attr="data-language-change-confirm=#{article.form.language.change.unsaved}">
    <!-- 공통 헤더 섹션 -->
    <th:block th:replace="~{common :: siteHeader}"></th:block>

    <!-- 공통 네비게이션 섹션 -->
    <th:block th:replace="~{common :: siteNavbar(false, true)}"></th:block> <!-- 글쓰기 버튼의 경우 newArticle에서는 렌더링 안되게 처리 -->

    <main id="main-content"
            class="container flex-fill py-4 py-md-5 editor-shell tw:relative">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9 tw:max-w-5xl">

                <!-- 게시글 목록 상단 섹션(글수정/글쓰기) -->
                <section class="editor-intro">
                    <p class="editor-intro__eyebrow">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span th:text="${article.id} != null ? 'EDIT' : 'WRITE'">WRITE</span>
                    </p>
                    <h2 class="editor-intro__title"
                        th:text="${article.id} != null
                            ? #{article.form.heading.edit}
                            : #{article.form.heading.create}">
                        글쓰기
                    </h2>
                </section>

                <!-- 게시글 작성,수정 섹션 -->
                <section class="card border-0 shadow-sm editor-card">
                    <div class="card-body p-4 p-md-5 editor-card__body">
                        <form id="article-form" novalidate>
                            <input type="hidden" id="article-id" th:value="${article.id}"> <!-- 아이디 정보 저장 -->

                            <!-- 게시글 제목,본문 섹션 -->
                            <section>

                                <!-- 제목 영역 -->
                                <div class="form-group mb-4 editor-field editor-field--title">
                                    <label for="title" class="editor-field__label">
                                        <span class="editor-field__title"
                                            th:text="#{article.form.title.label}">제목</span>
                                    </label>
                                    <input type="text"
                                            class="form-control editor-title-input"
                                            placeholder="제목을 입력해주세요."
                                            th:placeholder="#{article.form.title.placeholder}"
                                            id="title"
                                            data-max-length="40"
                                            aria-describedby="title-length title-error"
                                            autocomplete="off"
                                            required
                                            th:value="${article.title}">
                                    <div class="article-title__feedback mt-2" aria-live="polite">
                                        <small id="title-length"
                                                class="text-muted article-title__counter">0 / 40</small>
                                        <small id="title-error"
                                                class="d-none text-danger"
                                                aria-hidden="true"
                                                th:text="#{article.form.title.limit(40)}">제목은 40자 이내로 작성해주세요.</small>
                                    </div>
                                </div>

                                <!-- Summernote 본문 영역 -->
                                <div class="form-group mb-4 editor-field">
                                    <label for="content" class="editor-field__label">
                                        <span class="editor-field__title"
                                            th:text="#{article.form.content.label}">본문</span>
                                    </label>
                                    <textarea class="form-control"
                                        rows="12"
                                        placeholder="내용을 입력하세요."
                                        th:placeholder="#{article.form.content.placeholder}"
                                        id="content"
                                        th:text="${article.content}"></textarea>
                                    <small id="image-upload-status"
                                            class="d-block mt-2 text-muted"
                                            aria-live="polite"></small> <!-- 이미지 업로드 상태 메시지 -->
                                </div>
                                
                            </section>

                            <div id="article-form-message"
                                class="alert d-none editor-form-message"
                                role="status"
                                aria-live="polite"></div>

                            <!-- 게시글 등록·수정 버튼 영역 -->
                            <div class="editor-actions">
                                <a th:if="${article.id} != null"
                                    th:href="@{/articles/{id}(id=${article.id})}"
                                    class="btn app-button editor-actions__cancel">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                    <span th:text="#{article.form.cancel}">취소</span>
                                </a>
                                <a th:if="${article.id} == null"
                                    th:href="@{/articles}"
                                    class="btn app-button editor-actions__cancel">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                    <span th:text="#{article.form.cancel}">취소</span>
                                </a>
                                <button th:if="${article.id} != null"
                                        type="submit"
                                        id="modify-btn"
                                        class="btn btn-primary app-button editor-actions__submit">
                                    <i class="bi bi-check2" aria-hidden="true"></i>
                                    <span th:text="#{article.form.modify}">수정</span>
                                </button> <!-- id가 있을 때는 수정 버튼을, id가 없을 때는 등록 버튼 -->
                                <button th:if="${article.id} == null"
                                        type="submit"
                                        id="create-btn"
                                        class="btn btn-primary app-button editor-actions__submit">
                                    <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
                                    <span th:text="#{article.form.create}">등록</span>
                                </button>
                            </div>

                        </form>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- 공통 푸터 섹션 -->
    <th:block th:replace="~{common :: siteFooter}"></th:block>

    <!-- 게시글 작성·수정 JavaScript와 Summernote 렌더링 문구 -->
    <div id="article-form-messages"
        hidden
        data-image-max-count="50"
        th:attr="data-response-invalid=#{article.form.response.invalid},
            data-created=#{article.form.created},
            data-updated=#{article.form.updated},
            data-save-error=#{article.form.save.error},
            data-image-wait=#{article.form.image.wait},
            data-image-limit=#{article.form.image.limit},
            data-title-required=#{article.form.title.required},
            data-content-required=#{article.form.content.required},
            data-title-limit=#{article.form.title.limit},
            data-login-required=#{article.form.login.required},
            data-request-invalid=#{article.form.request.invalid},
            data-permission-denied=#{article.form.permission.denied},
            data-editor-language=#{article.editor.language},
            data-content-placeholder=#{article.form.content.placeholder},
            data-youtube-title=#{article.editor.youtube.title},
            data-image-uploading=#{article.editor.image.uploading},
            data-image-uploading-remaining=#{article.editor.image.uploading.remaining},
            data-image-failed=#{article.editor.image.failed},
            data-image-complete=#{article.editor.image.complete}"></div>

    <!-- Summernote 사용을 위한 외부 스크립트 -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script> <!-- Summernote 실행에 필요한 jQuery 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script> <!-- Summernote의 Bootstrap UI와 드롭다운·대화상자 지원 -->
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs4.min.js"></script> <!-- Bootstrap 기반 Summernote 본문 편집기 로드 -->
    <script th:if="${#locale.language == 'ko'}"
        src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/lang/summernote-ko-KR.min.js"></script> <!-- Summernote 한국어 메뉴와 대화상자 번역 로드 -->
    <script th:if="${#locale.language == 'ja'}"
        src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/lang/summernote-ja-JP.min.js"></script> <!-- Summernote 일본어 메뉴와 대화상자 번역 로드 -->

    <script src="/js/siteNavigation.js"></script> <!-- 스크롤 위치에 따른 공통 내비게이션 고정 상태 표시 -->
    <script src="/js/summernote.js"></script> <!-- 현재 표시 언어의 Summernote 초기화·모바일 메뉴 보정과 게시글 이미지 업로드 관리 -->
    <script src="/js/articleForm.js"></script> <!-- 게시글 작성·수정 검증·제출, 제목 제한과 언어 전환 전 입력 보호 관리 -->
</body>
</html>
