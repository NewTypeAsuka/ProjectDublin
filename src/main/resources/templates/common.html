<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="headLinks">
        <link rel="icon" href="/favicon.ico?v=1" type="image/x-icon"> <!-- 사이트 공통 favicon -->
        <link rel="shortcut icon" href="/favicon.ico?v=1" type="image/x-icon"> <!-- 사이트 공통 favicon -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"> <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> <!-- Bootstrap Icons CSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!-- Tailwind CSS -->
        <style type="text/tailwindcss"> /* Tailwind CSS */
            /* Tailwind CSS를 사용하여 공통 디자인 토큰과 유틸리티를 정의 */
            @layer theme, base, components, utilities;
            @import "tailwindcss/theme.css" layer(theme) prefix(tw);
            @import "tailwindcss/utilities.css" layer(utilities) prefix(tw);

            /* Tailwind 유틸리티에서 사용하는 공통 디자인 토큰 */
            @theme {
                --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                    "Segoe UI", "Noto Sans KR", sans-serif;
                --color-canvas: rgba(247, 249, 252, 1);
                --color-ink: rgba(25, 31, 40, 1);
                --color-muted: rgba(107, 118, 132, 1);
                --color-brand: rgba(49, 130, 246, 1);
                --color-brand-strong: rgba(27, 100, 218, 1);
                --color-surface: rgba(255, 255, 255, 1);
                --color-surface-soft: rgba(242, 244, 246, 1);
                --color-surface-glass: rgba(255, 255, 255, 0.84);
                --color-body: rgba(51, 61, 75, 1);
                --color-line: rgba(15, 23, 42, 0.08);
                --color-brand-soft: rgba(235, 244, 255, 1);
                --color-danger: rgba(225, 45, 63, 1);
                --color-success: rgba(0, 145, 100, 1);
                --color-admin: rgba(29, 155, 240, 1);
                --radius-card: 1.75rem;
                --shadow-card: 0 20px 60px rgba(15, 23, 42, 0.08);
                --shadow-float: 0 24px 72px rgba(15, 23, 42, 0.14);
            }
        </style>
    </th:block>
    <style th:fragment="styles">
        /* 공통 헤더 */
        .intro-header__title-link,
        .intro-header__title-link:visited,
        .intro-header__title-link:active {
            color: rgba(51, 65, 85, 1);
            text-decoration: none;
        }
        .intro-header__title-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }
        .intro-header__title-link:hover,
        .intro-header__title-link:focus {
            color: rgba(3, 105, 161, 1);
            text-decoration: none;
        }
        .intro-header__title-link:focus-visible {
            outline: 3px solid rgba(3, 105, 161, 0.35);
            outline-offset: 3px;
        }
        .intro-header__title {
            margin-bottom: 0;
            /* 미사용 보존: 아래의 현대화된 제목 규칙이 같은 속성을 대체한다.
            font-weight: 600;
            letter-spacing: 0.04em;
            */
        }

        /* 헤더 그라데이션 배경 */
        /* 미사용 보존: 아래의 현대화된 공통 헤더가 배경과 모션을 완전히 대체한다.
        .site-header {
            background: linear-gradient(135deg,
                rgba(230, 243, 255, 1),
                rgba(200, 231, 255, 1),
                rgba(170, 214, 255, 1),
                rgba(205, 236, 255, 1)
            );
            background-size: 240% 240%;
            animation: headerGradientAnimation 30s ease-in-out infinite;
        }
        @keyframes headerGradientAnimation {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 30%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 70%; }
            100% { background-position: 0% 50%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .site-header {
                animation: none;
            }
            .intro-header__title-link {
                transition: none;
            }
        }
        */

        /* 공통 내비게이션 */
        /* 미사용 보존: 현재 공통 내비게이션에는 Bootstrap .nav-link 요소가 없다.
        .site-nav .nav-link {
            transition: color 0.18s ease, transform 0.18s ease;
        }
        .site-nav .nav-link:hover,
        .site-nav .nav-link:focus {
            transform: translateY(-1px);
        }
        */

        /* 공통 내비게이션: 내부 정렬 */
        .site-nav__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: nowrap;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }
        .site-nav__menu {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 0.15rem;
        }

        /* 공통 내비게이션: 메뉴 드롭다운 */
        .site-nav-dropdown {
            position: relative;
            margin: 0;
        }
        .site-nav-dropdown > summary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            min-width: 2.5rem;
            /* 미사용 보존: 아래의 min-height가 더 큰 높이를 강제한다. */
            /* height: 2.5rem; */
            padding: 0 0.8rem;
            /* 미사용 보존: 아래의 현대화된 드롭다운 규칙이 대체한다.
            border-radius: 0.35rem;
            color: rgba(255, 255, 255, 0.75);
            */
            cursor: pointer;
            list-style: none;
            user-select: none;
            transition: color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
        }
        .site-nav-dropdown > summary::-webkit-details-marker {
            display: none;
        }
        .site-nav-dropdown > summary:hover,
        .site-nav-dropdown > summary:focus {
            /* 미사용 보존: 아래의 현대화된 hover·focus 규칙이 대체한다.
            color: rgba(255, 255, 255, 1);
            background-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
            */
            outline: none;
        }
        /* 미사용 보존: 아래의 현대화된 open 상태 규칙이 대체한다.
        .site-nav-dropdown[open] > summary {
            color: rgba(255, 255, 255, 1);
            background-color: rgba(255, 255, 255, 0.12);
        }
        */
        .site-nav-dropdown__icon {
            display: inline-block;
            width: auto;
            height: auto;
            border: 0;
            transform: none;
        }
        .site-nav-dropdown__menu {
            position: absolute;
            top: calc(100% + 0.45rem);
            left: 0;
            min-width: 13rem;
            /* 미사용 보존: 아래의 현대화된 메뉴 표면 규칙이 대체한다.
            padding: 0.5rem;
            border-radius: 0.8rem;
            background-color: rgba(255, 255, 255, 1);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.18);
            */
            z-index: 1040;
        }
        .site-nav-dropdown__item {
            /* 미사용 보존: 아래의 현대화된 메뉴 항목 규칙이 대체한다.
            display: block;
            */
            padding: 0.6rem 0.75rem;
            /* 미사용 보존: 아래의 현대화된 메뉴 항목 규칙이 대체한다.
            border-radius: 0.55rem;
            */
            font-size: 0.92rem;
            line-height: 1.35;
            /* 미사용 보존: 아래의 현대화된 메뉴 항목 규칙이 대체한다.
            color: rgba(95, 107, 122, 1);
            background-color: rgba(248, 249, 250, 1);
            */
            text-decoration: none;
        }
        .site-nav-dropdown__item:hover,
        .site-nav-dropdown__item:focus {
            /* 미사용 보존: 아래의 현대화된 hover·focus 규칙이 대체한다.
            color: rgba(31, 41, 55, 1);
            background-color: rgba(238, 242, 247, 1);
            */
            text-decoration: none;
            outline: none;
        }

        /* 공통 내비게이션: 글쓰기·로그아웃 액션 */
        .site-nav__actions {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .site-nav__actions .btn {
            margin: 0;
            white-space: nowrap;
        }

        /* 공통 내비게이션: 화면별 콘텐츠 폭 */
        @media (min-width: 992px) {
            .site-nav__inner {
                max-width: 800px;
            }
        }
        @media (min-width: 1200px) {
            .site-nav__inner {
                max-width: 855px;
            }
        }

        /* 스크롤 고정 상태 */
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 1030; /* 네비게이션 화면 앞에 띄우기 */
            transition: background-color 0.22s ease, box-shadow 0.22s ease;
        }
        .site-nav.is-stuck {
            /* 미사용 보존: 아래의 현대화된 고정 상태가 색상과 그림자를 대체한다.
            background-color: rgba(108, 117, 125, 0.96) !important;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.18);
            */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* 공통 푸터: GitHub 아이콘 */
        /* GitHub 아이콘 */
        .site-footer__icon {
            margin-right: 0.35rem;
        }

        /* Tailwind와 함께 사용하는 프로젝트 공통 모던 디자인 */
        /* 공통 디자인 토큰과 문서 기본값 */
        :root {
            --project-canvas: rgba(247, 249, 252, 1);
            --project-surface-soft: rgba(242, 244, 246, 1);
            --project-ink: rgba(25, 31, 40, 1);
            --project-body: rgba(51, 61, 75, 1);
            --project-muted: rgba(107, 118, 132, 1);
            --project-line: rgba(15, 23, 42, 0.08);
            --project-brand: rgba(49, 130, 246, 1);
            --project-brand-strong: rgba(27, 100, 218, 1);

            /* 미사용 보존: 현재 공통 CSS에서 참조하지 않는 레거시 토큰이다.
            --project-surface: rgba(255, 255, 255, 1);
            --project-brand-soft: rgba(235, 244, 255, 1);
            --project-danger: rgba(225, 45, 63, 1);
            */
        }
        html {
            scroll-behavior: smooth;
        }
        body.project-shell {
            /* 미사용 보존: 모든 project-shell 화면의 important tw:text-ink가 대체한다. */
            /* color: var(--project-ink); */
            /* tw:bg-canvas는 배경색만 대체하므로 배경 이미지 레이어는 유지한다. */
            background:
                radial-gradient(circle at 12% 8%, rgba(219, 234, 254, 0.72), transparent 25rem),
                radial-gradient(circle at 88% 18%, rgba(224, 231, 255, 0.58), transparent 24rem),
                var(--project-canvas);
            /* 미사용 보존: 모든 project-shell 화면의 important tw:font-sans가 대체한다. */
            /* font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                "Segoe UI", "Noto Sans KR", sans-serif; */
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        ::selection {
            color: rgba(25, 31, 40, 1);
            background-color: rgba(191, 219, 254, 1);
        }

        /* 접근성: 키보드 사용자를 위한 본문 바로가기 */
        .skip-link {
            position: absolute;
            top: 0.75rem;
            left: 50%;
            z-index: 1100;
            padding: 0.65rem 1rem;
            border-radius: 999px;
            color: rgba(255, 255, 255, 1);
            background-color: var(--project-brand-strong);
            transform: translate(-50%, -180%);
            transition: transform 0.18s ease;
        }
        .skip-link:focus {
            color: rgba(255, 255, 255, 1);
            text-decoration: none;
            transform: translate(-50%, 0);
        }

        /* 공통 헤더: 배경과 브랜드 문구 */
        .site-header {
            position: relative;
            overflow: hidden;
            border-color: var(--project-line) !important;
            background:
                radial-gradient(circle at 28% -30%, rgba(255, 255, 255, 0.95), transparent 20rem),
                linear-gradient(135deg,
                    rgba(240, 247, 255, 1),
                    rgba(228, 239, 255, 1),
                    rgba(242, 245, 255, 1)
                );
            animation: none;
        }
        .site-header::after {
            position: absolute;
            right: -5rem;
            bottom: -8rem;
            width: 18rem;
            height: 18rem;
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.56);
            filter: blur(2px);
            content: "";
            pointer-events: none;
        }
        .intro-header__eyebrow {
            margin-bottom: 0.55rem;
            color: var(--project-brand-strong);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.16em;
        }
        .intro-header__title {
            color: var(--project-ink);
            font-size: clamp(1.75rem, 4vw, 2.35rem);
            font-weight: 750;
            letter-spacing: -0.045em;
        }
        .intro-header__title-link:hover,
        .intro-header__title-link:focus {
            color: var(--project-brand-strong);
        }
        .intro-header__subtitle {
            max-width: 30rem;
            margin: 0.65rem auto 0;
            color: var(--project-muted);
            font-size: 0.92rem;
            line-height: 1.65;
        }

        /* 공통 내비게이션: 현대화된 색상과 드롭다운 표현 */
        .site-nav {
            border-bottom: 1px solid var(--project-line);
            background-color: rgba(255, 255, 255, 0.86) !important;
            box-shadow: none;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .site-nav.is-stuck {
            background-color: rgba(255, 255, 255, 0.92) !important;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
        }
        .site-nav-dropdown > summary {
            min-height: 2.75rem;
            border: 1px solid transparent;
            border-radius: 999px;
            color: var(--project-body);
            background-color: transparent;
        }
        .site-nav-dropdown > summary:hover,
        .site-nav-dropdown > summary:focus,
        .site-nav-dropdown[open] > summary {
            border-color: var(--project-line);
            color: var(--project-ink);
            background-color: var(--project-surface-soft);
            transform: none;
        }
        .site-nav-dropdown > summary:focus-visible,
        .site-nav__actions a:focus-visible,
        .site-footer a:focus-visible {
            outline: 3px solid rgba(49, 130, 246, 0.3);
            outline-offset: 3px;
        }
        .site-nav-dropdown__icon {
            font-size: 0.8rem;
            line-height: 1;
            transition: transform 0.18s ease;
        }
        .site-nav-dropdown[open] .site-nav-dropdown__icon {
            transform: rotate(180deg);
        }
        .site-nav-dropdown__menu {
            overflow: hidden;
            padding: 0.45rem;
            border: 1px solid var(--project-line);
            border-radius: 1rem;
            background-color: rgba(255, 255, 255, 0.96);
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
        }
        .site-nav-dropdown__item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-height: 2.75rem;
            border-radius: 0.75rem;
            color: var(--project-body);
            background-color: transparent;
        }
        .site-nav-dropdown__item:hover,
        .site-nav-dropdown__item:focus {
            color: var(--project-ink);
            background-color: var(--project-surface-soft);
        }

        /* 화면 내 일반 액션 버튼 공통 형태 */
        /* 공통 버튼: 화면 내 일반 액션과 내비게이션 액션 */
        .app-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            border-radius: 999px !important;
            font-weight: 650;
        }
        .site-nav__write,
        .site-nav__logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 2.75rem;
            padding: 0.55rem 0.95rem;
            /* 미사용 보존: 두 요소에 함께 적용된 app-button의 important radius가 대체한다. */
            /* border-radius: 999px; */
            font-weight: 650;
            transition: transform 0.18s ease, box-shadow 0.18s ease,
                background-color 0.18s ease;
        }
        .site-nav__write {
            border-color: var(--project-brand);
            color: rgba(255, 255, 255, 1);
            background-color: var(--project-brand);
            box-shadow: 0 8px 20px rgba(49, 130, 246, 0.22);
        }
        .site-nav__write:hover,
        .site-nav__write:focus {
            border-color: var(--project-brand-strong);
            color: rgba(255, 255, 255, 1);
            background-color: var(--project-brand-strong);
            transform: translateY(-1px);
        }
        .site-nav__logout {
            border-color: var(--project-line);
            color: var(--project-body);
            background-color: rgba(255, 255, 255, 0.7);
        }
        .site-nav__logout:hover,
        .site-nav__logout:focus {
            color: var(--project-ink);
            background-color: var(--project-surface-soft);
            transform: translateY(-1px);
        }

        /* 공통 푸터: 배경과 링크 */
        .site-footer {
            border-color: var(--project-line) !important;
            background-color: rgba(255, 255, 255, 0.72) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .site-footer__link {
            color: var(--project-muted);
            font-weight: 550;
            letter-spacing: -0.01em;
        }
        .site-footer__link:hover,
        .site-footer__link:focus {
            color: var(--project-brand-strong);
        }

        /* 모바일: 내비게이션과 헤더 밀도 조정 */
        @media (max-width: 575.98px) {
            .site-nav {
                padding-right: 0;
                padding-left: 0;
            }
            .site-nav__inner {
                gap: 0.5rem;
                padding-right: 0.75rem;
                padding-left: 0.75rem;
            }
            .site-nav-dropdown > summary {
                padding-right: 0.55rem;
                padding-left: 0.55rem;
            }
            .site-nav__actions {
                gap: 0.35rem;
            }
            .site-nav__write,
            .site-nav__logout {
                min-height: 2.5rem;
                padding: 0.45rem 0.7rem;
                font-size: 0.8rem;
            }
            .intro-header__subtitle {
                font-size: 0.86rem;
            }
        }

        /* 접근성: 사용자가 모션 감소를 선택한 경우 */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <!-- 공통 헤더 -->
    <header th:fragment="siteHeader" class="site-header border-bottom"> <!-- 헤더 그라데이션 배경 -->
        <a class="skip-link" href="#main-content">본문 바로가기</a>
        <div class="container py-4 py-md-5 text-center tw:relative tw:z-10">
            <p class="intro-header__eyebrow tw:uppercase">MY SPACE TO THINK</p>
            <a href="/" class="intro-header__title-link tw:no-underline">
                <h1 class="h1 intro-header__title">NewTypeBlog</h1>
            </a>
            <p class="intro-header__subtitle">
                NewTypeBlog에 오신 것을 환영합니다
            </p>
        </div>
    </header>

    <!-- 공통 내비게이션 -->
    <nav th:fragment="siteNavbar(showCreateButton)"
        class="navbar py-2 site-nav"
        id="site-nav"> <!--스크를 고정 상태 -->
        <div class="container site-nav__inner">
            <div class="navbar-nav flex-row site-nav__menu">
                <details class="site-nav-dropdown">
                    <summary aria-label="둘러보기 메뉴 열기">
                        <i class="bi bi-compass" aria-hidden="true"></i>
                        <span>메뉴</span>
                        <i class="bi bi-chevron-down site-nav-dropdown__icon"
                            aria-hidden="true"></i>
                    </summary>
                    <div class="site-nav-dropdown__menu">
                        <a class="site-nav-dropdown__item" href="/">
                            <i class="bi bi-house-door-fill" aria-hidden="true"></i>
                            <span>홈</span>
                        </a>
                        <!-- 추후 다른 기능으로 이동하는 링크 항목 추가 -->
                    </div>
                </details>
            </div>
            <div class="site-nav__actions">
                <a th:if="${showCreateButton}"
                    th:href="@{/new-article}"
                    id="create-btn"
