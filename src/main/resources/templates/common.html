<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="headLinks">
        <link rel="icon" href="/favicon.ico?v=1" type="image/x-icon"> <!-- 사이트 공통 favicon -->
        <link rel="shortcut icon" href="/favicon.ico?v=1" type="image/x-icon"> <!-- 사이트 공통 favicon -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"> <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> <!-- Bootstrap Icons CSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!-- Tailwind CSS 테마와 유틸리티 로드 -->

        <!-- CSRF: 상태 변경 API 요청에 사용할 세션 토큰과 헤더 이름 -->
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <script src="/js/csrf.js"></script> <!-- 동일 출처의 상태 변경 요청에 Spring Security CSRF 토큰 추가 -->

        <style type="text/tailwindcss"> /* tokens: Tailwind CSS */
            /* tokens: Tailwind 공통 디자인 토큰과 유틸리티 계층 */
            @layer theme, base, components, utilities;
            @import "tailwindcss/theme.css" layer(theme) prefix(tw);
            @import "tailwindcss/utilities.css" layer(utilities) prefix(tw);

            /* tokens: Tailwind 유틸리티에서 사용하는 공통 디자인 토큰 */
            @theme {
                --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                    "Segoe UI", "Noto Sans KR", sans-serif;
                --color-canvas: rgba(247, 249, 252, 1);
                --color-ink: rgba(25, 31, 40, 1);
                --color-muted: rgba(107, 118, 132, 1);
                --color-brand: rgba(49, 130, 246, 1);
                --color-brand-strong: rgba(27, 100, 218, 1);
                --color-surface: rgba(255, 255, 255, 1);
                --color-surface-soft: rgba(242, 244, 246, 1);
                --color-surface-glass: rgba(255, 255, 255, 0.84);
                --color-body: rgba(51, 61, 75, 1);
                --color-line: rgba(15, 23, 42, 0.08);
                --color-brand-soft: rgba(235, 244, 255, 1);
                --color-danger: rgba(225, 45, 63, 1);
                --color-success: rgba(0, 145, 100, 1);
                --color-admin: rgba(29, 155, 240, 1);
                --radius-card: 1.75rem;
                --shadow-card: 0 20px 60px rgba(15, 23, 42, 0.08);
                --shadow-float: 0 24px 72px rgba(15, 23, 42, 0.14);
            }
        </style>
    </th:block>
    <style th:fragment="styles">
        /* layout: 공통 헤더 브랜드 링크 */
        .intro-header__title-link,
        .intro-header__title-link:visited,
        .intro-header__title-link:active {
            color: rgba(51, 65, 85, 1);
            text-decoration: none;
        }
        .intro-header__title-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }
        .intro-header__title-link:hover,
        .intro-header__title-link:focus {
            color: rgba(3, 105, 161, 1);
            text-decoration: none;
        }

        /* 접근성: 공통 헤더 링크의 키보드 포커스 표시 */
        .intro-header__title-link:focus-visible {
            outline: 3px solid rgba(3, 105, 161, 0.35);
            outline-offset: 3px;
        }
        .intro-header__title {
            margin-bottom: 0;
        }

        /* layout: 공통 내비게이션 내부 정렬 */
        .site-nav__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: nowrap;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }
        .site-nav__menu {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 0.15rem;
        }

        /* layout: 공통 내비게이션 메뉴 드롭다운 */
        .site-nav-dropdown {
            position: relative;
            margin: 0;
        }
        .site-nav-dropdown > summary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            min-width: 2.5rem;
            padding: 0 0.8rem;
            cursor: pointer;
            list-style: none;
            user-select: none;
            transition: color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
        }
        .site-nav-dropdown > summary::-webkit-details-marker {
            display: none;
        }
        .site-nav-dropdown > summary:hover,
        .site-nav-dropdown > summary:focus {
            outline: none;
        }
        .site-nav-dropdown__icon {
            display: inline-block;
            width: auto;
            height: auto;
            border: 0;
            transform: none;
        }
        .site-nav-dropdown__menu {
            position: absolute;
            top: calc(100% + 0.45rem);
            left: 0;
            min-width: 13rem;
            z-index: 1040;
        }
        .site-nav-dropdown__item {
            padding: 0.6rem 0.75rem;
            font-size: 0.92rem;
            line-height: 1.35;
            text-decoration: none;
        }
        .site-nav-dropdown__item:hover,
        .site-nav-dropdown__item:focus {
            text-decoration: none;
            outline: none;
        }

        /* layout: 공통 내비게이션 글쓰기·로그아웃 액션 */
        .site-nav__actions {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .site-nav__actions .btn {
            margin: 0;
            white-space: nowrap;
        }

        /* 반응형layout: 데스크탑 화면별 내비게이션 콘텐츠 폭 */
        @media (min-width: 992px) {
            .site-nav__inner {
                max-width: 800px;
            }
        }
        @media (min-width: 1200px) {
            .site-nav__inner {
                max-width: 855px;
            }
        }

        /* layout: 스크롤 고정 상태 */
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 1030; /* layout: 내비게이션을 화면 앞에 배치 */
            transition: background-color 0.22s ease, box-shadow 0.22s ease;
        }
        .site-nav.is-stuck {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* layout: 공통 푸터 GitHub 아이콘 */
        .site-footer__icon {
            margin-right: 0.35rem;
        }

        /* tokens: Tailwind와 함께 사용하는 프로젝트 공통 디자인 토큰 */
        :root {
            --project-canvas: rgba(247, 249, 252, 1);
            --project-surface-soft: rgba(242, 244, 246, 1);
            --project-ink: rgba(25, 31, 40, 1);
            --project-body: rgba(51, 61, 75, 1);
            --project-muted: rgba(107, 118, 132, 1);
            --project-line: rgba(15, 23, 42, 0.08);
            --project-brand: rgba(49, 130, 246, 1);
            --project-brand-strong: rgba(27, 100, 218, 1);
        }

        /* base: 문서 스크롤과 프로젝트 공통 배경·타이포그래피 */
        html {
            scroll-behavior: smooth;
        }
        body.project-shell {
            background:
                radial-gradient(circle at 12% 8%, rgba(219, 234, 254, 0.72), transparent 25rem),
                radial-gradient(circle at 88% 18%, rgba(224, 231, 255, 0.58), transparent 24rem),
                var(--project-canvas);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        ::selection {
            color: rgba(25, 31, 40, 1);
            background-color: rgba(191, 219, 254, 1);
        }

        /* 접근성: 키보드 사용자를 위한 본문 바로가기 */
        .skip-link {
            position: absolute;
            top: 0.75rem;
            left: 50%;
            z-index: 1100;
            padding: 0.65rem 1rem;
            border-radius: 999px;
            color: rgba(255, 255, 255, 1);
            background-color: var(--project-brand-strong);
            transform: translate(-50%, -180%);
            transition: transform 0.18s ease;
        }
        .skip-link:focus {
            color: rgba(255, 255, 255, 1);
            text-decoration: none;
            transform: translate(-50%, 0);
        }

        /* layout: 공통 헤더 배경과 브랜드 문구 */
        .site-header {
            position: relative;
            overflow: hidden;
            border-color: var(--project-line) !important;
            background:
                radial-gradient(circle at 28% -30%, rgba(255, 255, 255, 0.95), transparent 20rem),
                linear-gradient(135deg,
                    rgba(240, 247, 255, 1),
                    rgba(228, 239, 255, 1),
                    rgba(242, 245, 255, 1)
                );
            animation: none;
        }
        .site-header::after {
            position: absolute;
            right: -5rem;
            bottom: -8rem;
            width: 18rem;
            height: 18rem;
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.56);
            filter: blur(2px);
            content: "";
            pointer-events: none;
        }
        .intro-header__eyebrow {
            margin-bottom: 0.55rem;
            color: var(--project-brand-strong);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.16em;
        }
        .intro-header__title {
            color: var(--project-ink);
            font-size: clamp(1.75rem, 4vw, 2.35rem);
            font-weight: 750;
            letter-spacing: -0.045em;
        }
        .intro-header__title-link:hover,
        .intro-header__title-link:focus {
            color: var(--project-brand-strong);
        }
        .intro-header__subtitle {
            max-width: 30rem;
            margin: 0.65rem auto 0;
            color: var(--project-muted);
            font-size: 0.92rem;
            line-height: 1.65;
        }

        /* layout: 공통 내비게이션 색상과 드롭다운 표현 */
        .site-nav {
            border-bottom: 1px solid var(--project-line);
            background-color: rgba(255, 255, 255, 0.86) !important;
            box-shadow: none;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* interaction: 스크롤 고정 내비게이션 상태 */
        .site-nav.is-stuck {
            background-color: rgba(255, 255, 255, 0.92) !important;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
        }
        .site-nav-dropdown > summary {
            min-height: 2.75rem;
            border: 1px solid transparent;
            border-radius: 999px;
            color: var(--project-body);
            background-color: transparent;
        }

        /* interaction: 내비게이션 드롭다운의 hover·focus·open 상태 */
        .site-nav-dropdown > summary:hover,
        .site-nav-dropdown > summary:focus,
        .site-nav-dropdown[open] > summary {
            border-color: var(--project-line);
            color: var(--project-ink);
            background-color: var(--project-surface-soft);
            transform: none;
        }

        /* 접근성: 내비게이션과 푸터 링크의 키보드 포커스 표시 */
        .site-nav-dropdown > summary:focus-visible,
        .site-nav__actions a:focus-visible,
        .site-footer a:focus-visible {
            outline: 3px solid rgba(49, 130, 246, 0.3);
            outline-offset: 3px;
        }

        /* animation: 드롭다운 화살표의 open 회전 효과 */
        .site-nav-dropdown__icon {
            font-size: 0.8rem;
            line-height: 1;
            transition: transform 0.18s ease;
        }
        .site-nav-dropdown[open] .site-nav-dropdown__icon {
            transform: rotate(180deg);
        }
        .site-nav-dropdown__menu {
            overflow: hidden;
            padding: 0.45rem;
            border: 1px solid var(--project-line);
            border-radius: 1rem;
            background-color: rgba(255, 255, 255, 0.96);
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
        }
        .site-nav-dropdown__item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-height: 2.75rem;
            border-radius: 0.75rem;
            color: var(--project-body);
            background-color: transparent;
        }

        /* interaction: 드롭다운 메뉴 항목의 hover·focus 상태 */
        .site-nav-dropdown__item:hover,
        .site-nav-dropdown__item:focus {
            color: var(--project-ink);
            background-color: var(--project-surface-soft);
        }

        /* layout: 링크와 버튼으로 구성된 내비게이션 항목의 동일한 너비와 정렬 */
        .site-nav-dropdown__item--button {
            width: 100%;
            border: 0;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
        }

        /* layout: 마이페이지 모달의 프로필 정보와 닉네임 수정 폼 */
        body.user-profile-open {
            overflow: hidden;
        }
        .site-profile-dialog {
            width: min(34rem, calc(100% - 2rem));
            max-width: none;
            max-height: calc(100dvh - 2rem);
            margin: auto;
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--project-line);
            border-radius: 1.5rem;
            color: var(--project-ink);
            background-color: rgba(255, 255, 255, 1);
            box-shadow: 0 28px 90px rgba(15, 23, 42, 0.24);
        }
        .site-profile-dialog::backdrop {
            background-color: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .site-profile-dialog__surface {
            max-height: calc(100dvh - 2rem);
            overflow-y: auto;
        }
        .site-profile-dialog__header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) max-content;
            align-items: start;
            gap: 1rem;
            padding: 1.5rem 1.5rem 1rem;
        }
        .site-profile-dialog__eyebrow {
            margin-bottom: 0.35rem;
            color: var(--project-brand-strong);
            font-size: 0.68rem;
            font-weight: 750;
            letter-spacing: 0.14em;
        }
        .site-profile-dialog__title {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 750;
            letter-spacing: -0.035em;
        }
        .site-profile-dialog__close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            padding: 0;
            border: 1px solid var(--project-line);
            border-radius: 999px;
            color: var(--project-muted);
            background-color: rgba(255, 255, 255, 1);
        }
        .site-profile-dialog__body {
            padding: 0 1.5rem 1.5rem;
        }
        .site-profile-dialog__loading,
        .site-profile-dialog__load-error {
            min-height: 14rem;
            padding: 3rem 1rem;
            color: var(--project-muted);
            text-align: center;
        }
        .site-profile-dialog__load-error i {
            display: block;
            margin-bottom: 0.75rem;
            color: rgba(225, 45, 63, 1);
            font-size: 1.6rem;
        }
        .site-profile-dialog__identity {
            padding: 1rem;
            border-radius: 1.15rem;
            background-color: var(--project-surface-soft);
        }
        .site-profile-dialog__nickname {
            display: block;
            overflow: hidden;
            color: var(--project-ink);
            font-size: 1rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .site-profile-dialog__email {
            display: block;
            margin-top: 0.15rem;
            color: var(--project-muted);
            font-size: 0.8rem;
            overflow-wrap: anywhere;
        }
        .site-profile-dialog__stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
            margin-top: 0.85rem;
        }
        .site-profile-dialog__stat {
            margin: 0;
            padding: 1rem;
            border: 1px solid var(--project-line);
            border-radius: 1rem;
            background-color: rgba(255, 255, 255, 1);
        }
        .site-profile-dialog__stat dt {
            margin-bottom: 0.35rem;
            color: var(--project-muted);
            font-size: 0.78rem;
            font-weight: 600;
        }
        .site-profile-dialog__stat dd {
            margin: 0;
            color: var(--project-ink);
            font-size: 1.35rem;
            font-weight: 750;
        }
        .site-profile-dialog__form {
            margin-top: 1.15rem;
            padding-top: 1.15rem;
            border-top: 1px solid var(--project-line);
        }
        .site-profile-dialog__label {
            margin-bottom: 0.45rem;
            color: var(--project-body);
            font-size: 0.86rem;
            font-weight: 650;
        }
        .site-profile-dialog__input-wrap {
            position: relative;
        }
        .site-profile-dialog__input {
            min-height: 3rem;
            padding-right: 3.8rem;
            border-color: rgba(15, 23, 42, 0.12);
            border-radius: 0.9rem;
            color: var(--project-ink);
            background-color: rgba(255, 255, 255, 1);
        }
        .site-profile-dialog__counter {
            position: absolute;
            top: 50%;
            right: 0.9rem;
            color: var(--project-muted);
            font-size: 0.76rem;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .site-profile-dialog__guide {
            min-height: 1.3rem;
            margin: 0.45rem 0 0;
            color: var(--project-muted);
            font-size: 0.77rem;
        }
        .site-profile-dialog__message {
            margin: 0.85rem 0 0;
            border: 0;
            border-radius: 0.85rem;
            font-size: 0.82rem;
        }
        .site-profile-dialog__actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.65rem;
            margin-top: 1rem;
        }
        .site-profile-dialog__action {
            min-height: 2.8rem;
            border-radius: 0.9rem !important;
        }

        /* interaction: 마이페이지 모달의 입력·버튼 상태 피드백 */
        .site-profile-dialog__close:hover,
        .site-profile-dialog__close:focus {
            color: var(--project-ink);
            background-color: var(--project-surface-soft);
        }
        .site-profile-dialog__input:focus {
            border-color: rgba(49, 130, 246, 0.7);
            box-shadow: 0 0 0 0.2rem rgba(49, 130, 246, 0.14);
        }
        .site-profile-dialog__input[aria-invalid="true"] {
            border-color: rgba(225, 45, 63, 0.7);
        }
        .site-profile-dialog__guide.is-valid {
            color: rgba(0, 145, 100, 1);
        }
        .site-profile-dialog__guide.is-invalid {
            color: rgba(225, 45, 63, 1);
        }

        /* 접근성: 마이페이지 모달 버튼의 키보드 포커스 표시 */
        .site-profile-dialog button:focus-visible,
        .site-profile-dialog input:focus-visible {
            outline: 3px solid rgba(49, 130, 246, 0.3);
            outline-offset: 2px;
        }

        /* layout: 화면 내 일반 액션과 내비게이션 버튼 공통 형태 */
        .app-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            border-radius: 999px !important;
            font-weight: 650;
        }
        .site-nav__write,
        .site-nav__logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 2.75rem;
            padding: 0.55rem 0.95rem;
            font-weight: 650;
            transition: transform 0.18s ease, box-shadow 0.18s ease,
                background-color 0.18s ease;
        }

        /* layout: POST 로그아웃 폼이 내비게이션 버튼 정렬에 영향을 주지 않게 한다. */
        .site-nav__logout-form {
            margin: 0;
        }
        .site-nav__write {
            border-color: var(--project-brand);
            color: rgba(255, 255, 255, 1);
            background-color: var(--project-brand);
            box-shadow: 0 8px 20px rgba(49, 130, 246, 0.22);
        }

        /* interaction: 글쓰기 버튼의 hover·focus 상태 */
        .site-nav__write:hover,
        .site-nav__write:focus {
            border-color: var(--project-brand-strong);
            color: rgba(255, 255, 255, 1);
            background-color: var(--project-brand-strong);
            transform: translateY(-1px);
        }
        .site-nav__logout {
            border-color: var(--project-line);
            color: var(--project-body);
            background-color: rgba(255, 255, 255, 0.7);
        }

        /* interaction: 로그아웃 버튼의 hover·focus 상태 */
        .site-nav__logout:hover,
        .site-nav__logout:focus {
            color: var(--project-ink);
            background-color: var(--project-surface-soft);
            transform: translateY(-1px);
        }

        /* layout: 공통 푸터 배경과 링크 */
        .site-footer {
            border-color: var(--project-line) !important;
            background-color: rgba(255, 255, 255, 0.72) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .site-footer__link {
            color: var(--project-muted);
            font-weight: 550;
            letter-spacing: -0.01em;
        }

        /* interaction: 공통 푸터 링크의 hover·focus 상태 */
        .site-footer__link:hover,
        .site-footer__link:focus {
            color: var(--project-brand-strong);
        }

        /* 반응형layout: 모바일 내비게이션·헤더·마이페이지 모달 밀도 조정 */
        @media (max-width: 575.98px) {
            .site-nav {
                padding-right: 0;
                padding-left: 0;
            }
            .site-nav__inner {
                gap: 0.5rem;
                padding-right: 0.75rem;
                padding-left: 0.75rem;
            }
            .site-nav-dropdown > summary {
                padding-right: 0.55rem;
                padding-left: 0.55rem;
            }
            .site-nav__actions {
                gap: 0.35rem;
            }
            .site-nav__write,
            .site-nav__logout {
                min-height: 2.5rem;
                padding: 0.45rem 0.7rem;
                font-size: 0.8rem;
            }
            .intro-header__subtitle {
                font-size: 0.86rem;
            }
            .site-profile-dialog {
                width: calc(100% - 1rem);
                max-height: calc(100dvh - 1rem);
                border-radius: 1.15rem;
            }
            .site-profile-dialog__surface {
                max-height: calc(100dvh - 1rem);
            }
            .site-profile-dialog__header {
                padding: 1.2rem 1rem 0.85rem;
            }
            .site-profile-dialog__body {
                padding: 0 1rem 1rem;
            }
            .site-profile-dialog__stat {
                padding: 0.85rem;
            }
        }

        /* 접근성: 사용자가 모션 감소를 선택한 경우 */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <!-- 공통 헤더 섹션 -->
    <header th:fragment="siteHeader" class="site-header border-bottom">
        <a class="skip-link" href="#main-content">본문 바로가기</a>
        <div class="container py-4 py-md-5 text-center tw:relative tw:z-10">
            <p class="intro-header__eyebrow tw:uppercase">MY SPACE TO THINK</p>
            <a href="/" class="intro-header__title-link tw:no-underline">
                <h1 class="h1 intro-header__title">NewTypeBlog</h1>
            </a>
            <p class="intro-header__subtitle">
                NewTypeBlog에 오신 것을 환영합니다
            </p>
        </div>
    </header>

    <!-- 공통 내비게이션 섹션 -->
    <th:block th:fragment="siteNavbar(showCreateButton)">
        <nav class="navbar py-2 site-nav" id="site-nav">
            <div class="container site-nav__inner">

                <!-- 네비게이션 메뉴 영역 -->
                <div class="navbar-nav flex-row site-nav__menu">
                    <details class="site-nav-dropdown">
                        <summary aria-label="둘러보기 메뉴 열기">
                            <i class="bi bi-compass" aria-hidden="true"></i>
                            <span>메뉴</span>
                            <i class="bi bi-chevron-down site-nav-dropdown__icon"
                                aria-hidden="true"></i>
                        </summary>
                        <div class="site-nav-dropdown__menu">
                            <a class="site-nav-dropdown__item" href="/">
                                <i class="bi bi-house-door-fill" aria-hidden="true"></i>
                                <span>홈</span>
                            </a>
                            <button id="user-profile-open"
                                    class="site-nav-dropdown__item site-nav-dropdown__item--button"
                                    type="button"
                                    aria-haspopup="dialog"
                                    aria-controls="user-profile-dialog">
                                <i class="bi bi-person-circle" aria-hidden="true"></i>
                                <span>마이페이지</span>
                            </button>
                            <a class="site-nav-dropdown__item" href="/menu/stocks">
                                <i class="bi bi-graph-up-arrow" aria-hidden="true"></i>
                                <span>주식</span>
                            </a>
                            <a class="site-nav-dropdown__item" href="/menu/chat">
                                <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
                                <span>채팅</span>
                            </a>
                        </div>
                    </details>
                </div>

                <!-- 네비게이션 버튼 영역 -->
                <div class="site-nav__actions">
                    <a th:if="${showCreateButton}"
                        th:href="@{/new-article}"
                        id="create-btn"
                        class="btn btn-sm app-button site-nav__write">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span>글쓰기</span>
                    </a> <!-- 글쓰기 버튼의 경우 newArticle에서는 렌더링 안되게 처리 -->
                    <form action="/logout" method="post" class="site-nav__logout-form">
                        <input type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}"> <!-- 로그아웃도 토큰을 검증할 수 있도록 POST 폼으로 전송(csrf) -->
                        <button type="submit" class="btn btn-sm app-button site-nav__logout">
                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                            <span>로그아웃</span>
                        </button>
                    </form>
                </div>

            </div>
        </nav>

        <!-- 마이페이지 모달 영역 -->
        <dialog id="user-profile-dialog"
                class="site-profile-dialog"
                aria-labelledby="user-profile-title">
            <div class="site-profile-dialog__surface">
                <!-- 마이페이지 모달 헤더 영역 -->
                <header class="site-profile-dialog__header">
                    <div>
                        <p class="site-profile-dialog__eyebrow">MY PAGE</p>
                        <h2 id="user-profile-title" class="site-profile-dialog__title">마이페이지</h2>
                    </div>
                    <button id="user-profile-close"
                            class="site-profile-dialog__close"
                            type="button"
                            aria-label="마이페이지 닫기">
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                </header>

                <!-- 마이페이지 정보 영역 -->
                <div class="site-profile-dialog__body">
                    <div id="user-profile-loading"
                        class="site-profile-dialog__loading"
                        role="status">
                        <span class="spinner-border spinner-border-sm mr-2" aria-hidden="true"></span>
                        내 정보를 불러오는 중입니다
                    </div>
                    <div id="user-profile-load-error"
                        class="site-profile-dialog__load-error d-none"
                        role="alert">
                        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                        <p id="user-profile-load-error-message">내 정보를 불러오지 못했습니다</p>
                        <button id="user-profile-retry"
                                class="btn btn-sm app-button btn-outline-secondary"
                                type="button">
                            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                            <span>다시 시도</span>
                        </button>
                    </div>
                    <div id="user-profile-content" class="d-none">
                        <div class="site-profile-dialog__identity">
                            <strong id="user-profile-current-nickname"
                                class="site-profile-dialog__nickname"></strong>
                            <span id="user-profile-email"
                                class="site-profile-dialog__email"></span>
                        </div>

                        <!-- 사용자 활동 요약 영역 -->
                        <dl class="site-profile-dialog__stats" aria-label="내 활동 요약">
                            <div class="site-profile-dialog__stat">
                                <dt>작성한 글</dt>
                                <dd id="user-profile-article-count">0</dd>
                            </div>
                            <div class="site-profile-dialog__stat">
                                <dt>댓글·답글</dt>
                                <dd id="user-profile-comment-count">0</dd>
                            </div>
                        </dl>

                        <!-- 닉네임 수정 영역 -->
                        <form id="user-profile-nickname-form"
                            class="site-profile-dialog__form"
                            novalidate>
                            <label for="user-profile-nickname"
                                class="site-profile-dialog__label">닉네임</label>
                            <div class="site-profile-dialog__input-wrap">
                                <input id="user-profile-nickname"
                                        class="form-control site-profile-dialog__input"
                                        type="text"
                                        minlength="3"
                                        maxlength="12"
                                        autocomplete="nickname"
                                        aria-describedby="user-profile-nickname-guide user-profile-message"
                                        required>
                                <span id="user-profile-nickname-counter"
                                    class="site-profile-dialog__counter"
                                    aria-hidden="true">0/12</span>
                            </div>
                            <p id="user-profile-nickname-guide"
                                class="site-profile-dialog__guide">
                                3자 이상 12자 이하로 입력해주세요
                            </p>
                            <p id="user-profile-message"
                                class="alert d-none site-profile-dialog__message"
                                role="status"
                                aria-live="polite"></p>
                            <div class="site-profile-dialog__actions">
                                <button id="user-profile-cancel"
                                        class="btn btn-outline-secondary app-button site-profile-dialog__action"
                                        type="button">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                    <span>취소</span>
                                </button>
                                <button id="user-profile-submit"
                                        class="btn btn-primary app-button site-profile-dialog__action"
                                        type="submit"
                                        disabled>
                                    <i id="user-profile-submit-icon"
                                        class="bi bi-check2"
                                        aria-hidden="true"></i>
                                    <span>수정</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </dialog>
        <script src="/js/userProfile.js"></script> <!-- 마이페이지 정보 조회와 닉네임 변경·화면 반영 -->
    </th:block>

    <!-- 공통 푸터 섹션 -->
    <footer th:fragment="siteFooter" class="mt-auto bg-white border-top site-footer">
        <div class="container py-4 text-center small">
            <a href="https://github.com/NewTypeAsuka/ProjectDublin"
                class="intro-header__title-link site-footer__link">
                <i class="bi bi-github site-footer__icon" aria-hidden="true"></i>
                2026 NewTypeAsuka. All rights reserved.
            </a>
        </div>
    </footer>
</body>
</html>
