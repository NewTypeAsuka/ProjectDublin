<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="headLinks">
        <link rel="icon" href="/favicon.ico?v=1" type="image/x-icon"> <!-- 사이트 공통 favicon -->
        <link rel="shortcut icon" href="/favicon.ico?v=1" type="image/x-icon"> <!-- 사이트 공통 favicon -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"> <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> <!-- Bootstrap Icons CSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!-- Tailwind CSS 테마와 유틸리티 로드 -->

        <!-- CSRF: 상태 변경 API 요청에 사용할 세션 토큰과 헤더 이름 -->
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <script src="/js/csrf.js"></script> <!-- 동일 출처의 상태 변경 요청에 Spring Security CSRF 토큰 추가 -->

        <style type="text/tailwindcss">
            @import url("/css/common.css");
        </style> <!-- Tailwind 설정과 공통 모듈 CSS -->

    </th:block>
</head>
<body>
    <!-- 공통 헤더 섹션 -->
    <header th:fragment="siteHeader" class="site-header border-bottom">
        <a class="skip-link" href="#main-content" th:text="#{common.header.skip}">본문 바로가기</a>
        <div class="container py-4 py-md-5 text-center tw:relative tw:z-10">
            <p class="intro-header__eyebrow tw:uppercase">MY SPACE TO THINK</p>
            <a href="/" class="intro-header__title-link tw:no-underline">
                <h1 class="h1 intro-header__title">NewTypeBlog</h1>
            </a>
            <p class="intro-header__subtitle" th:text="#{common.header.subtitle}">
                NewTypeBlog에 오신 것을 환영합니다.
            </p>
        </div>
    </header>

    <!-- 공통 내비게이션 섹션 -->
    <th:block th:fragment="siteNavbar(showCreateButton, languageToggleEnabled)">
        <nav class="navbar py-2 site-nav" id="site-nav">
            <div class="container site-nav__inner">

                <!-- 네비게이션 메뉴 영역 -->
                <div class="navbar-nav flex-row site-nav__menu">
                    <details class="site-nav-dropdown">
                        <summary aria-label="둘러보기 메뉴 열기"
                                th:attr="aria-label=#{common.nav.open.aria}">
                            <i class="bi bi-compass" aria-hidden="true"></i>
                            <span th:text="#{common.nav.menu}">메뉴</span>
                            <i class="bi bi-chevron-down site-nav-dropdown__icon"
                                aria-hidden="true"></i>
                        </summary>
                        <div class="site-nav-dropdown__menu">
                            <a class="site-nav-dropdown__item" href="/">
                                <i class="bi bi-journal-richtext" aria-hidden="true"></i>
                                <span th:text="#{common.nav.posts}">포스트</span>
                            </a>
                            <button id="user-profile-open"
                                    class="site-nav-dropdown__item site-nav-dropdown__item--button"
                                    type="button"
                                    aria-haspopup="dialog"
                                    aria-controls="user-profile-dialog">
                                <i class="bi bi-person-circle" aria-hidden="true"></i>
                                <span th:text="#{common.nav.profile}">마이페이지</span>
                            </button>
                            <a class="site-nav-dropdown__item" href="/menu/stocks">
                                <i class="bi bi-graph-up-arrow" aria-hidden="true"></i>
                                <span th:text="#{common.nav.stocks}">주식</span>
                            </a>
                            <a class="site-nav-dropdown__item" href="/menu/chat">
                                <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
                                <span th:text="#{common.nav.chat}">채팅</span>
                            </a>

                            <!-- 언어 선택 토글 영역 -->
                            <div class="site-nav-language">
                                <th:block th:replace="~{common :: languageToggle(${languageToggleEnabled})}"></th:block>
                            </div>
                            
                        </div>
                    </details>
                </div>

                <!-- 네비게이션 버튼 영역 -->
                <div class="site-nav__actions">
                    <a th:if="${showCreateButton}"
                        th:href="@{/new-article}"
                        id="create-btn"
                        class="btn btn-sm app-button site-nav__write">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span th:text="#{common.nav.write}">글쓰기</span>
                    </a> <!-- 글쓰기 버튼의 경우 newArticle에서는 렌더링 안되게 처리 -->
                    <form action="/logout" method="post" class="site-nav__logout-form">
                        <input type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}"> <!-- 로그아웃도 토큰을 검증할 수 있도록 POST 폼으로 전송(csrf) -->
                        <button type="submit" class="btn btn-sm app-button site-nav__logout">
                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                            <span th:text="#{common.nav.logout}">로그아웃</span>
                        </button>
                    </form>
                </div>

            </div>
        </nav>

        <!-- 마이페이지 모달 영역 -->
        <dialog id="user-profile-dialog"
                class="site-profile-dialog"
                aria-labelledby="user-profile-title">
            <div class="site-profile-dialog__surface">

                <!-- 마이페이지 모달 헤더 영역 -->
                <header class="site-profile-dialog__header">
                    <div>
                        <p class="site-profile-dialog__eyebrow">MY PAGE</p>
                        <h2 id="user-profile-title"
                            class="site-profile-dialog__title"
                            th:text="#{common.profile.title}">마이페이지</h2>
                    </div>
                    <button id="user-profile-close"
                            class="site-profile-dialog__close"
                            type="button"
                            aria-label="마이페이지 닫기"
                            th:attr="aria-label=#{common.profile.close.aria}">
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                </header>

                <!-- 마이페이지 정보 영역 -->
                <div class="site-profile-dialog__body">
                    <div id="user-profile-loading"
                        class="site-profile-dialog__loading"
                        role="status">
                        <span class="spinner-border spinner-border-sm mr-2" aria-hidden="true"></span>
                        <span th:text="#{common.profile.loading}">내 정보를 불러오는 중입니다.</span>
                    </div>
                    <div id="user-profile-load-error"
                        class="site-profile-dialog__load-error d-none"
                        role="alert">
                        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                        <p id="user-profile-load-error-message"
                            th:text="#{common.profile.load.error}">내 정보를 불러오지 못했습니다.</p>
                        <button id="user-profile-retry"
                                class="btn btn-sm app-button btn-outline-secondary"
                                type="button">
                            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                            <span th:text="#{common.action.retry}">다시 시도</span>
                        </button>
                    </div>
                    <div id="user-profile-content" class="d-none">
                        <div class="site-profile-dialog__identity">
                            <strong id="user-profile-current-nickname"
                                class="site-profile-dialog__nickname"></strong>
                            <span id="user-profile-email"
                                class="site-profile-dialog__email"></span>
                        </div>

                        <!-- 사용자 활동 요약 영역 -->
                        <dl class="site-profile-dialog__stats"
                            aria-label="내 활동 요약"
                            th:attr="aria-label=#{common.profile.stats.aria}">
                            <div class="site-profile-dialog__stat">
                                <dt th:text="#{common.profile.stats.articles}">작성한 글</dt>
                                <dd id="user-profile-article-count">0</dd>
                            </div>
                            <div class="site-profile-dialog__stat">
                                <dt th:text="#{common.profile.stats.comments}">댓글·답글</dt>
                                <dd id="user-profile-comment-count">0</dd>
                            </div>
                        </dl>

                        <!-- 닉네임 수정 영역 -->
                        <form id="user-profile-nickname-form"
                            class="site-profile-dialog__form"
                            novalidate>
                            <label for="user-profile-nickname"
                                class="site-profile-dialog__label"
                                th:text="#{common.profile.nickname.label}">닉네임 수정</label>
                            <div class="site-profile-dialog__input-wrap">
                                <input id="user-profile-nickname"
                                        class="form-control site-profile-dialog__input"
                                        type="text"
                                        minlength="3"
                                        maxlength="12"
                                        autocomplete="nickname"
                                        aria-describedby="user-profile-nickname-guide user-profile-message"
                                        required>
                                <span id="user-profile-nickname-counter"
                                    class="site-profile-dialog__counter"
                                    aria-hidden="true">0/12</span>
                            </div>
                            <p id="user-profile-nickname-guide"
                                class="site-profile-dialog__guide"
                                th:text="#{common.profile.nickname.guide.default}">
                                3자 이상 12자 이하로 입력해주세요.
                            </p>
                            <p id="user-profile-message"
                                class="alert d-none site-profile-dialog__message"
                                role="status"
                                aria-live="polite"></p>
                            <div class="site-profile-dialog__actions">
                                <button id="user-profile-cancel"
                                        class="btn btn-outline-secondary app-button site-profile-dialog__action"
                                        type="button">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                    <span th:text="#{common.action.cancel}">취소</span>
                                </button>
                                <button id="user-profile-submit"
                                        class="btn btn-primary app-button site-profile-dialog__action"
                                        type="submit"
                                        disabled>
                                    <i id="user-profile-submit-icon"
                                        class="bi bi-check2"
                                        aria-hidden="true"></i>
                                    <span th:text="#{common.action.modify}">수정</span>
                                </button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </dialog>

        <!-- 마이페이지 JavaScript 렌더링 문구 -->
        <div id="user-profile-messages"
            hidden
            th:attr="data-nickname-duplicate=#{common.profile.nickname.duplicate},
                data-nickname-invalid=#{common.profile.nickname.invalid},
                data-nickname-updated=#{common.profile.nickname.updated},
                data-nickname-update-error=#{common.profile.nickname.update.error},
                data-load-error-retry=#{common.profile.load.error.retry},
                data-guide-default=#{common.profile.nickname.guide.default},
                data-guide-short=#{common.profile.nickname.guide.short},
                data-guide-max=#{common.profile.nickname.guide.max},
                data-guide-different=#{common.profile.nickname.guide.different},
                data-guide-valid=#{common.profile.nickname.guide.valid},
                data-guide-current=#{common.profile.nickname.guide.current}"></div>

        <script src="/js/userProfile.js"></script> <!-- 마이페이지 정보 조회와 닉네임 변경·화면 반영 -->
        <script th:if="${languageToggleEnabled}"
                src="/js/languageToggle.js"></script> <!-- 전환 지원 화면에서 한국어·일본어 선택을 현재 URL에 반영 -->
    </th:block>

    <!-- 언어 선택 토글 영역 -->
    <div th:fragment="languageToggle(enabled)" class="language-selector">
        <span class="language-selector__label" aria-hidden="true">Language</span>
        <button class="language-toggle"
                type="button"
                data-language-toggle
                th:disabled="${!enabled}"
                th:attr="data-current-language=${enabled and #locale.language == 'ja'} ? 'ja' : 'ko',
                    aria-label=${enabled} ? #{language.toggle.aria} : #{language.toggle.pending.aria},
                    title=${enabled} ? #{language.toggle.title} : #{language.toggle.pending.title}">
            <span class="language-toggle__option"
                    data-language="ko"
                    th:classappend="${!enabled or #locale.language == 'ko'} ? ' is-active'">
                <img class="language-toggle__mark"
                    th:src="@{/img/koreaFlag.svg}"
                    src="/img/koreaFlag.svg"
                    width="19"
                    height="14"
                    alt="태극기"
                    aria-hidden="true">
                <span lang="ko" th:text="#{language.korean}">한국어</span>
            </span>
            <span class="language-toggle__option"
                    data-language="ja"
                    th:classappend="${enabled and #locale.language == 'ja'} ? ' is-active'">
                <img class="language-toggle__mark"
                    th:src="@{/img/japanFlag.svg}"
                    src="/img/japanFlag.svg"
                    width="19"
                    height="14"
                    alt="일장기"
                    aria-hidden="true">
                <span lang="ja" th:text="#{language.japanese}">日本語</span>
            </span>
        </button>
    </div>

    <!-- 공통 푸터 섹션 -->
    <footer th:fragment="siteFooter" class="mt-auto bg-white border-top site-footer">
        <div class="container py-4 text-center small">
            <a href="https://github.com/NewTypeAsuka/ProjectDublin"
                class="intro-header__title-link site-footer__link">
                <i class="bi bi-github site-footer__icon" aria-hidden="true"></i>
                2026 NewTypeAsuka. All rights reserved.
            </a>
        </div>
    </footer>

</body>
</html>
