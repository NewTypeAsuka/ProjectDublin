<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 반응형 디자인을 위한 viewport 설정 -->
    <title th:text="#{chat.page.title}">채팅 · NewTypeBlog</title>
    <th:block th:replace="~{common :: headLinks}"></th:block> <!-- favicon과 Bootstrap CSS -->
    <link rel="stylesheet" href="/css/chat.css"> <!-- 채팅 화면 CSS -->
</head>
<body class="d-flex flex-column min-vh-100 bg-light project-shell tw:bg-canvas tw:text-ink tw:font-sans"
    th:attr="data-language-change-confirm=#{chat.language.change.unsaved}">
    <!-- 공통 헤더 섹션 -->
    <th:block th:replace="~{common :: siteHeader}"></th:block>

    <!-- 공통 네비게이션 섹션 -->
    <th:block th:replace="~{common :: siteNavbar(true, true)}"></th:block>

    <main id="main-content"
        class="container flex-fill py-4 py-md-5 tw:relative tw:z-0">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9 tw:max-w-4xl">

                <!-- 공개 채팅 상단 섹션 -->
                <section class="chat-toolbar" aria-labelledby="chat-page-title">
                    <div class="chat-toolbar__heading">
                        <span class="chat-toolbar__eyebrow">
                            <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
                            CHAT
                        </span>
                        <div class="chat-toolbar__title-row">
                            <h2 id="chat-page-title"
                                class="chat-toolbar__title"
                                th:text="#{chat.heading}">채팅</h2>
                            <div id="chat-connection"
                                class="chat-connection"
                                role="status"
                                aria-live="polite">
                                <span class="chat-connection__dot" aria-hidden="true"></span>
                                <span id="chat-connection-label"
                                    th:text="#{chat.connection.preparing}">연결 준비 중</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 공개 채팅방 섹션 -->
                <section class="chat-panel" aria-labelledby="chat-room-name">
                    
                    <!-- 채팅방 정보 영역 -->
                    <header class="chat-panel__header">
                        <div class="chat-panel__identity">
                            <span class="chat-panel__icon" aria-hidden="true">
                                <i class="bi bi-people-fill"></i>
                            </span>
                            <div class="tw:min-w-0">
                                <strong id="chat-room-name"
                                    class="chat-panel__name"
                                    th:text="#{chat.room.name}">공개 채팅방</strong>
                                <span class="chat-panel__guide"
                                    th:text="#{chat.room.guide}">모든 로그인 사용자가 함께 대화할 수 있습니다.</span>
                            </div>
                        </div>
                        <span class="chat-panel__limit">
                            <i class="bi bi-chat-text" aria-hidden="true"></i>
                            <span th:text="#{chat.limit.label}">메시지</span>
                            <span th:text="#{chat.limit.unit}">300자</span>
                        </span>
                    </header>

                    <!-- 채팅 메시지 이력 영역 -->
                    <div id="chat-viewport" class="chat-viewport">
                        <div id="chat-history" class="chat-history" hidden>
                            <button id="chat-history-button"
                                class="chat-history__button"
                                type="button">
                                <i class="bi bi-clock-history" aria-hidden="true"></i>
                                <span th:text="#{chat.history.previous}">이전 메시지</span>
                            </button>
                        </div>

                        <div id="chat-loading" class="chat-state" role="status">
                            <span class="chat-state__icon" aria-hidden="true">
                                <span class="spinner-border spinner-border-sm" role="presentation"></span>
                            </span>
                            <strong class="chat-state__title"
                                th:text="#{chat.state.loading.title}">대화를 불러오는 중입니다.</strong>
                            <span th:text="#{common.wait}">잠시만 기다려주세요.</span>
                        </div>

                        <div id="chat-empty" class="chat-state" hidden>
                            <span class="chat-state__icon" aria-hidden="true">
                                <i class="bi bi-chat-heart"></i>
                            </span>
                            <strong class="chat-state__title"
                                th:text="#{chat.state.empty.title}">아직 작성된 메시지가 없습니다.</strong>
                            <span th:text="#{chat.state.empty.description}">첫 번째 대화를 시작해보세요.</span>
                        </div>

                        <div id="chat-load-error" class="chat-state" role="alert" hidden>
                            <span class="chat-state__icon" aria-hidden="true">
                                <i class="bi bi-cloud-slash"></i>
                            </span>
                            <strong class="chat-state__title"
                                th:text="#{chat.state.error.title}">대화를 불러오지 못했습니다.</strong>
                            <button id="chat-retry-button"
                                class="btn btn-sm chat-history__button"
                                type="button">
                                <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                                <span th:text="#{common.action.retry}">다시 시도</span>
                            </button>
                        </div>

                        <ol id="chat-message-list"
                            class="chat-message-list"
                            aria-live="polite"
                            aria-relevant="additions removals"></ol>
                    </div>

                    <!-- 채팅 메시지 작성 영역 -->
                    <form id="chat-form" class="chat-composer" novalidate>
                        <div class="chat-composer__row">
                            <div class="chat-composer__field">
                                <label class="sr-only"
                                    for="chat-message-input"
                                    th:text="#{chat.input.label}">채팅 메시지</label>
                                <textarea id="chat-message-input"
                                    class="chat-composer__input"
                                    rows="1"
                                    maxlength="300"
                                    placeholder="메시지를 입력해주세요."
                                    th:placeholder="#{chat.input.placeholder}"
                                    data-language-change-guard
                                    enterkeyhint="send"
                                    aria-describedby="chat-message-counter chat-form-message"
                                    disabled></textarea>
                                <span id="chat-message-counter"
                                    class="chat-composer__counter"
                                    aria-hidden="true">0/300</span>
                            </div>
                            <button id="chat-submit-button"
                                class="chat-composer__submit"
                                type="submit"
                                disabled>
                                <i id="chat-submit-icon" class="bi bi-send-fill" aria-hidden="true"></i>
                                <span class="chat-composer__submit-label"
                                    th:text="#{chat.action.send}">전송</span>
                            </button>
                        </div>
                        <p id="chat-form-message"
                            class="chat-composer__message"
                            role="status"
                            aria-live="polite"></p>
                    </form>

                </section>
            </div>
        </div>
    </main>

    <!-- 공통 푸터 섹션 -->
    <th:block th:replace="~{common :: siteFooter}"></th:block>

    <!-- 채팅 JavaScript 렌더링 문구 -->
    <div id="chat-messages"
        hidden
        th:attr="data-user=#{chat.message.user},
            data-admin=#{chat.message.admin},
            data-delete=#{chat.message.delete},
            data-history-loading=#{chat.history.loading},
            data-history-previous=#{chat.history.previous},
            data-history-load-error=#{chat.history.load.error},
            data-delete-confirm=#{chat.message.delete.confirm},
            data-delete-error=#{chat.message.delete.error},
            data-connection-required=#{chat.connection.required},
            data-validation-length=#{chat.validation.length},
            data-sending=#{chat.message.sending},
            data-send-delayed=#{chat.message.send.delayed},
            data-process-error=#{chat.message.process.error},
            data-module-error-label=#{chat.connection.module.error.label},
            data-module-error=#{chat.connection.module.error},
            data-security-error-label=#{chat.security.error.label},
            data-security-error=#{chat.security.error},
            data-connected=#{chat.connection.connected},
            data-display-error=#{chat.message.display.error},
            data-retrying=#{chat.connection.retrying},
            data-disconnected-retrying=#{chat.connection.disconnected.retrying},
            data-connecting=#{chat.connection.connecting}"></div>

    <script src="/js/siteNavigation.js"></script> <!-- 스크롤 위치에 따른 공통 내비게이션 고정 상태 표시 -->
    <!-- STOMP WebSocket 연결과 공개 채팅 동작 -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script> <!-- 브라우저의 STOMP WebSocket 통신 지원 -->
    <script src="/js/chat.js"></script> <!-- 채팅 이력 조회·실시간 송수신·48시간 만료·메시지 삭제 -->
</body>
</html>
